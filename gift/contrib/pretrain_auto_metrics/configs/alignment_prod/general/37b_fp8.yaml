---
run_name: <run_name>
exp_name: <exp_name>
user: <user>

tensorboard_path: /home/jovyan/${user}/tensorboard_test/${exp_name}

max_seq_len: 65536

autometrics:
  globals:
    delete_converted_hf: false
    full_metrics_recalculate: false

  router:
    host: 0.0.0.0

  convertation:
    mappers:
      - map_gigafsdp_to_hf_safetensor
    input_tp_size: 1

  preparation:
    skip: true

  quantization:
    skip: false
    device_map: auto
    quantization_config:
      weight_block_size: [128, 128]
      modules_to_not_convert: [
        "lm_head",
        "embed_tokens",
        "shared_head.head",
        "mlp.gate.weight",
        "eh_proj",
        "self_attn.A_log",
        "self_attn.conv1d",
        "self_attn.dt_bias",
        "self_attn.in_proj_ba",
        "self_attn.norm.weight",
        "self_attn.gate_proj",
        "gate_up_projection",
        "gate_down_projection",
        "shared_expert_sigmoid",
        "indexer.wk",
        "indexer.weights_proj",
        "mlp.gate_proj",
        "mlp.up_proj",
        "mlp.down_proj",
        "mlp.shared_experts",
      ]

  inference:
    shared_params:
      allow-auto-truncate: true
      enable-dp-attention: true
      disable-prefill-cuda-graph: true
    prefill_fraction: 0.5
    prefill:
      tp: 2
      ep: 2
      dp: 2
      pp: 4
      mem-fraction-static: 0.70
      max-running-requests: 256
      max-mamba-cache-size: 1280
      chunked-prefill-size: 32768
    decode:
      tp: 8
      ep: 8
      dp: 8
      mem-fraction-static: 0.80
      max-running-requests: 1536
      max-mamba-cache-size: 3072
      auto-mtp: true
      disaggregation-decode-extra-slots: 4
      enable-gdn-spec-replay-commit: true

  model_info:
    model_class: "sft"
    size: "max"
    username: ${user}

  obm_proxy:
    chat-template-kwargs:
      reasoning: true
      use_devsystem: false
      use_suggester: false
    reasoning-token-budget: 32768
    chat-template: <path to jinja template>

  evaluators:
    safety_unified:
      judges:
        Qwen3-235B-A22B-Instruct-2507-FP8: all
        Qwen3.5-397B-A17B-FP8: all
      selection_manifest: big_pipeline.json
      domain_rules_file: domain_rules.json

    aa_lcr:
      judge:
        model_name: "Qwen3-235B-A22B-Instruct-2507-FP8"
    new_obm:
      obm_config: devices-v2
      all:
        tasks:
          - struct_eval_text
          - natural_plan
          - nih_complex
          - graphwalks

    new_obm_judged:
      obm_config: devices
      all:
        tasks:
          - pollux
      judges:
        pollux-judge-32b:
          - pollux

    lm_eval:
      instruct:
        jsonschema_bench:
          log_samples: true

        ifbench:
          log_samples: true

    dredd:
      judge:
        model_name: "minimax-m2.7"
      datasets:
        - name: "arena-hard-logs-v3"
          baseline:
            name: "openrouter-openai-gpt-5-2"
        - name: "validator-sbs-pollux"
          baseline:
            name: "openrouter-openai-gpt-5-2"
        - name: "ru-llm-arena"
          baseline:
            name: "openrouter-openai-gpt-5-2"
        - name: "arena-hard-ru"
          baseline:
            name: "openrouter-openai-gpt-5-2"
        - name: "sbs-gc3-ultra-vs-alice-ai"
          baseline:
            name: "Alice_Ai_LLM_2025_10"
