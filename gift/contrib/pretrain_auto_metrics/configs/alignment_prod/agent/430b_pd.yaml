---
run_name: <run_name>
exp_name: <exp_name>
user: <user>

tensorboard_path: /home/jovyan/${user}/tensorboard_test/${exp_name}

max_seq_len: 65536

autometrics:
  globals:
    delete_converted_hf: false
    full_metrics_recalculate: false

  router:
    host: 0.0.0.0

  convertation:
    mappers:
      - map_gigafsdp_to_hf_safetensor
    input_tp_size: 1

  preparation:
    skip: true

  inference:
    shared_params:
      allow-auto-truncate: true
      tp: 16
      ep: 16
      dp: 4
      enable-dp-attention: true
    prefill_fraction: 0.3
    prefill:
      mem-fraction-static: 0.7
      gated-norm-impl: triton
      chunked-prefill-size: 32768
    decode: {}

  model_info:
    model_class: "sft"
    size: "lite"
    username: ${user}

  obm_proxy:
    # sampling-params:
    #   temperature: 0.7
    chat-template-kwargs:
      reasoning: true
      use_devsystem: false
      use_suggester: false
    reasoning-token-budget: 32768
    chat-template: <path to jinja template>

  evaluators:
    gigametric:
      benchmarks:
        toolathlon:
          num_attempts: 3
          workers: 32
          timeout_seconds: 5400

    tau3:
      num-trials: 3
      domains:
        - airline
        - retail
        - telecom
        - banking_knowledge
      user_model_name: Qwen3-235B-A22B-Instruct-2507-FP8
    appworld: {}

    skillsbench:
      agent: openhands-cli
      pass-at-k: 1
      max-tokens: 16384
      max-input-tokens: 98304
      agent-timeout: 28800
      n-concurrent: 32

    bfcl:
      model: gigachat-FC
      test_category: all

    harbor_rli:
      runs:
        - benchmark: harness-bench-lite
          n-concurrent: 64
          pass-at-k: 8
          agent-timeout: 25200
          benchmark-kwargs:
            forward-reasoning-history: true
            recursion-limit: 80
        - benchmark: harness-bench-medium
          n-concurrent: 64
          pass-at-k: 8
          agent-timeout: 25200
          benchmark-kwargs:
            forward-reasoning-history: true
            recursion-limit: 80
        - benchmark: cowork-bench
          agent: strands
          max-tokens: 32768
          n-concurrent: 64
          pass-at-k: 1
          agent-timeout: 25200

    tau2:
      domains:
        - airline
        - retail
        - telecom
      user_model_name: Qwen3-235B-A22B-Instruct-2507-FP8
