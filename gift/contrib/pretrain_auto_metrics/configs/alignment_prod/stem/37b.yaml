---
run_name: <run_name>
exp_name: <exp_name>
user: <user>

tensorboard_path: /home/jovyan/${user}/tensorboard_test/${exp_name}

max_seq_len: 65536

autometrics:
  globals:
    delete_converted_hf: false
    full_metrics_recalculate: false

  router:
    host: 0.0.0.0

  convertation:
    mappers:
      - map_gigafsdp_to_hf_safetensor
    input_tp_size: 1

  preparation:
    skip: true

  inference:
    shared_params:
      allow-auto-truncate: true
      enable-dp-attention: true
      disable-prefill-cuda-graph: true
    prefill_fraction: 0.5
    prefill:
      tp: 2
      ep: 2
      dp: 2
      pp: 4
      mem-fraction-static: 0.70
      max-running-requests: 256
      max-mamba-cache-size: 1280
      chunked-prefill-size: 32768
    decode:
      tp: 8
      ep: 8
      dp: 8
      mem-fraction-static: 0.80
      max-running-requests: 1536
      max-mamba-cache-size: 3072
      auto-mtp: true
      disaggregation-decode-extra-slots: 4
      enable-gdn-spec-replay-commit: true

  model_info:
    model_class: "sft"
    size: "max"
    username: ${user}

  obm_proxy:
    chat-template-kwargs:
      reasoning: true
      use_devsystem: false
      use_suggester: false
    reasoning-token-budget: 32768
    chat-template: <path to jinja template>

  evaluators:
    gigametric:
      benchmarks:
        esg:
        hr:
        drpa_gc:
        tenderscanner:
        insait:
        papayaedition:
        fin_consultant:
        papaya_kib_table:
        bank_legal_document_analysis:
        bank_multilabel_numbers:
        bank_legal_hypothetical_norm:
        bank_multilabel:
        bank_multichoice:
        rubq:
        b2c_fin_literacy_combined:
        bbac:

    gigametric_judged:
      benchmarks:
        bank_agents:
        kazna:
        mmb_summ:
        mmb_rec:
        Legal_L1_QuickAnswer:
        ragqa:
        finance_qa:
        finam_finbench:
      judges:
        Qwen3-235B-A22B-Instruct-2507-FP8:
          - bank_agents
          - kazna
          - mmb_summ
          - mmb_rec
          - Legal_L1_QuickAnswer
          - ragqa
          - finance_qa
          - finam_finbench

    new_obm:
      obm_config: devices-v2
      all:
        tasks:
          - gpqa_diamond_official
          - aime_2025
          - aime_2026
          - hmmt

    new_obm_judged:
      obm_config: devices
      all:
        tasks:
          - hle_text
          - imo_answer_bench
      judges:
        Qwen3-235B-A22B-Instruct-2507-FP8:
          - hle_text
          - imo_answer_bench
