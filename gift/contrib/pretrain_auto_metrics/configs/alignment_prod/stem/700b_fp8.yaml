---
run_name: <run_name>
exp_name: <exp_name>
user: <user>

tensorboard_path: /home/jovyan/${user}/tensorboard_test/${exp_name}

max_seq_len: 65536

autometrics:
  globals:
    delete_converted_hf: false
    full_metrics_recalculate: false

  router:
    host: 0.0.0.0

  convertation:
    mappers:
      - map_gigafsdp_to_hf_safetensor
    input_tp_size: 1

  preparation:
    skip: true

  inference:
    shared_params:
      allow-auto-truncate: true
      enable-dp-attention: true
      enable-dp-attention-local-control-broadcast: true
      kv-cache-dtype: fp8_e4m3
      disable-prefill-cuda-graph: true
    prefill_fraction: 0.75
    prefill:
      tp: 8
      ep: 8
      dp: 8
      pp: 4
      chunked-prefill-size: 65536
    decode:
      tp: 32
      ep: 32
      dp: 32
      chunked-prefill-size: 8192
      auto-mtp: true
      disaggregation-decode-extra-slots: 4
      enable-gdn-spec-replay-commit: true

  quantization:
    skip: false
    device_map: auto
    quantization_config:
      weight_block_size: [128, 128]
      modules_to_not_convert: [
        "lm_head",
        "embed_tokens",
        "shared_head.head",
        "mlp.gate.weight",
        "eh_proj",
        "self_attn.A_log",
        "self_attn.conv1d",
        "self_attn.dt_bias",
        "self_attn.in_proj_ba",
        "self_attn.norm.weight",
        "self_attn.gate_proj",
        "gate_up_projection",
        "gate_down_projection",
        "shared_expert_sigmoid",
        "indexer.wk",
        "indexer.weights_proj",
        "mlp.gate_proj",
        "mlp.up_proj",
        "mlp.down_proj",
        "mlp.shared_experts",
      ]

  model_info:
    model_class: "sft"
    size: "ultra"
    username: ${user}

  obm_proxy:
    chat-template-kwargs:
      reasoning: true
      use_devsystem: false
      use_suggester: false
    reasoning-token-budget: 32768
    chat-template: <path to jinja template>

  evaluators:
    gigametric:
      benchmarks:
        esg:
        hr:
        drpa_gc:
        tenderscanner:
        insait:
        papayaedition:
        fin_consultant:
        papaya_kib_table:
        bank_legal_document_analysis:
        bank_multilabel_numbers:
        bank_legal_hypothetical_norm:
        bank_multilabel:
        bank_multichoice:
        rubq:
        b2c_fin_literacy_combined:
        bbac:

    gigametric_judged:
      benchmarks:
        bank_agents:
        kazna:
        mmb_summ:
        mmb_rec:
        Legal_L1_QuickAnswer:
        ragqa:
        finance_qa:
        finam_finbench:
      judges:
        Qwen3-235B-A22B-Instruct-2507-FP8:
          - bank_agents
          - kazna
          - mmb_summ
          - mmb_rec
          - Legal_L1_QuickAnswer
          - ragqa
          - finance_qa
          - finam_finbench

    new_obm:
      obm_config: devices-v2
      all:
        tasks:
          - gpqa_diamond_official
          - aime_2025
          - aime_2026
          - hmmt

    new_obm_judged:
      obm_config: devices
      all:
        tasks:
          - hle_text
          - imo_answer_bench
      judges:
        Qwen3-235B-A22B-Instruct-2507-FP8:
          - hle_text
          - imo_answer_bench
