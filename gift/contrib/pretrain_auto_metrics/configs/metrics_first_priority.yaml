---
run_name: <run_name>
exp_name: <exp_name>
user: <user>

tensorboard_path: /home/jovyan/${user}/tensorboard_test/${exp_name}

max_seq_len: 65536

autometrics:
  globals:
    delete_converted_hf: false
    full_metrics_recalculate: false

  router:
    host: 0.0.0.0

  convertation:
    mappers:
      - map_gigafsdp_to_hf_safetensor
    input_tp_size: 1

  preparation:
    skip: true

  inference:
    allow-auto-truncate: true
    tp: 32
    ep: 32
    max-running-requests: 128
    mem-fraction-static: 0.75
    context-length: 65536


  model_info:
    model_class: "sft"
    size: "lite"
    username: ${user}

  obm_proxy:
    # sampling-params:
    #   temperature: 0.7
    chat-template-kwargs:
      reasoning: false
      use_devsystem: true
      default_devsystem: ""
    chat-template: <chat_template>


  evaluators:
    safety_unified:
      judges:
        Qwen3-235B-A22B-Instruct-2507-FP8: all
        Qwen3.5-397B-A17B-FP8: all
      selection_manifest: big_pipeline.json
      domain_rules_file: domain_rules.json

    tau3:
      num-trials: 3
      domains:
        - airline
        - retail
        - telecom
        - banking_knowledge
      user_model_name: Qwen3-235B-A22B-Instruct-2507-FP8

    new_obm:
      obm_config: devices-v2

      all:
        tasks:
          - struct_eval
          - gpqa_diamond_cot
          - mmlu_pro
          - natural_plan
          - nih_complex

    new_obm_judged:
      obm_config: devices
      all:
        tasks:
          - pollux
      judges:
        pollux-judge-32b:
          - pollux

    lm_eval:
      instruct:
        lcb_code_gen_lite_instruct:
          log_samples: true

        ifbench:
          log_samples: true

    bfcl:
      model: gigachat-FC
      test_category: all

    tau2:
      domains:
        - airline
        - retail
        - telecom
      user_model_name: Qwen3-235B-A22B-Instruct-2507-FP8

    nl2repo:
      agent: openhands-sdk
      pass-at-k: 1
      max-tokens: 16384
      max-input-tokens: 98304
      n-concurrent: 32

    terminal_bench:
      agent: mini-swe-agent
      max-tokens: 16384
      max-input-tokens: 98304
      n-concurrent: 89

    harbor_rli:
      runs:
        - benchmark: harness-bench-lite
          pass-at-k: 8
          agent_timeout: 3600
          benchmark-kwargs:
            forward-reasoning-history: true
            recursion-limit: 80
        - benchmark: harness-bench-medium
          pass-at-k: 8
          agent_timeout: 3600
          benchmark-kwargs:
            forward-reasoning-history: true
            recursion-limit: 80
        - benchmark: terminal-bench-2.1
          agent: mini-swe-agent
          max-tokens: 16384
          n-concurrent: 89
          pass-at-k: 1
        - benchmark: cowork-bench
          agent: strands
          max-tokens: 32768
          n-concurrent: 64
          pass-at-k: 1
        - benchmark: swe-bench-multilingual
          agent: mini-swe-agent
          max-tokens: 16384
          n-concurrent: 64
          pass-at-k: 1

    pier_rli:
      benchmark: deepswe
      command-timeout: 30
      agent: mini-swe-agent
      max-tokens: 16384
      n-concurrent: 64

    swe_bench:
      agent: mini-swe-agent
      max-tokens: 16384
      max-input-tokens: 98304
      n-concurrent: 64

    mera:
      # System prompt applied to all MERA tasks. Keep "none" to use the default
      # prompt, or replace it with a custom string. Individual tasks can
      # override it by setting their own system_instruction
      # (see simplear below).
      system_instruction: none

      simplear:
        # system_instruction: "Custom prompt for this task only"
        none

      bps_gen:
        none

      lcs_gen:
        none

      chegeka:
        none

      mathlogicqa_gen:
        none

      parus_gen:
        none

      rcb_gen:
        none

      rudetox:
        none

      ruhatespeech_gen:
        none

      rummlu_gen:
        none

      ruworldtree_gen:
        none

      ruopenbookqa_gen:
        none

      rumultiar:
        none

      use:
        none

      rwsd_gen:
        none

      mamuramu_gen:
        none

      multiq:
        none

      rumodar:
        none

      ruhhh_gen:
        none

      ruethics_gen:
        none

      rucodeeval:
        none

      ruhumaneval:
        none

      agro_bench:
        none

      aqua_bench:
        none

      med_bench:
        none

      codecorrectness:
        none

      codelintereval:
        none

      rucodereviewer:
        none

      strucom:
        none

    dredd:
      judge:
        model_name: "minimax-m2.7"
      datasets:
        - name: "sbs-gc3-ultra-vs-alice-ai"
          baseline:
            name: "Alice_Ai_LLM_2025_10"

    # checkpoint_stats: статистика весов HF-чекпоинта, см. README, блок 20.
    checkpoint_stats: {}
