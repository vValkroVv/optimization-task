run_name: gigametric_700b
exp_name: gigametric_700b
user: user

tensorboard_path: /home/jovyan/${user}/tensorboard_test/${exp_name}
max_seq_len: 8192

autometrics:
    globals:
        delete_converted_hf: false
        full_metrics_recalculate: false

    router:
        host: 0.0.0.0

    convertation:
        mappers:
            - map_gigafsdp_to_hf_safetensor
        input_tp_size: 1

    preparation:
        skip: true

    inference:
        allow-auto-truncate: true
        tp: 32 # аналогично configs/700b.yaml
        ep: 32

    obm_proxy:
        # sampling-params:
        #     temperature: 0.7
        chat-template-kwargs:
            reasoning: true
        # Кастомный chat formatting через jinja (аналогично configs/700b.yaml).
        # Альтернатива: opensource-mode через
        # inference.tool_call_parser=gigachat3.
        chat-template: <path to jinja template>

    model_info:
        model_class: "sft"
        size: "ultra"
        username: ${user}

    evaluators:
        gigametric:
            base_dir: /home/jovyan/${user}/gigametric_runs
            local_model_id: gigachat_700b_local

            max_concurrent_requests: 5
            benchmarks:
                aime_26:
                    num_items: 2
                bbac:
                    num_items: 2
                ifeval:
                    num_items: 2
                math500:
                    num_items: 2
                naturalplan:
                    num_items: 2
