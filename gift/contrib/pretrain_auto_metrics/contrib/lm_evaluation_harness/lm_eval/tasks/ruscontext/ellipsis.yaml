
task: ruscontext_ellipsis
include: _ruscontext_template_yaml
dataset_name: ellipsis
doc_to_text: !function utils.ellipsis_to_text
doc_to_target: !function utils.ellipsis_to_target

output_type: generate_until
generation_kwargs:
  until:
    - "\n\n"
  max_gen_toks: 200

metric_list:
  - metric: acc
    aggregation: !function utils.aggregate_ellipsis_acc
    higher_is_better: true
  - metric: f1
    aggregation: !function utils.aggregate_ellipsis_f1
    higher_is_better: true
