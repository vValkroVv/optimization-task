task: russian_gec
dataset_path: dreuxx26/russian_gec
test_split: train

output_type: generate_until
num_fewshot: 0
doc_to_text: "Предложение с ошибкой:\n{{incorrect}}\nИсправленное предложение:\n"
doc_to_target: "{{target_text}}"
generation_kwargs:
  until:
    - "\n"
    - "\n\n"
    - "</s>"
    - "Предложение с ошибкой"
  do_sample: false
  temperature: 0.0
  max_gen_toks: 200
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
metadata:
  version: 1.0
