
tag: pollux
task: pollux_judging
dataset_path: ai-forever/POLLUX
dataset_name: null
test_split: test
fewshot_split: test
num_fewshot: 5
output_type: generate_until
generation_kwargs:
  temperature: 0.0
  do_sample: false
  max_gen_toks: 500
  until:
    - "\n\n"
    - "\n"

doc_to_text: !function utils.doc_to_text
doc_to_target: "{{criteria_score}}"
process_results: !function utils.process_results

metric_list:
  - metric: mae
    aggregation: mean
    higher_is_better: false

metadata:
  version: 1.0
