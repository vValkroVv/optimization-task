[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlite-s3-query"
version = "0.1.12"
description = "Query SQLite files stored in S3 via signed HTTP requests."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.28,<3"
]
authors = [
  { name = "sqlite_s3_query team" }
]

[project.optional-dependencies]
test = [
  "pytest>=7.4.0"
]

[tool.setuptools]
packages = ["sqlite_s3_query"]
