build:docker_base:
  extends:
    - .build:docker_base
  variables:
    UV_INDEX_PYTORCH_NIGHTLY_CU130_USERNAME: "gitlab-ci-token"
    UV_INDEX_PYTORCH_NIGHTLY_CU130_PASSWORD: "${CI_JOB_TOKEN}"
  before_script:
    - !reference [.build:docker_base, before_script]
    - uv --version
    - uv lock --project gift_docker --python python3.12 --prerelease allow
  allow_failure: true

build:papaya_docker:
  extends: .build:papaya_docker
  stage: build
  allow_failure: true
  needs:
    - job: build:docker_base
      artifacts: true

save:job_id:
  extends:
    - .papaya:save_job_id
    - .rules:on_trigger:always
    - .rules:always_no_mr
  stage: papaya

trigger:papaya:
  extends:
    - .papaya:trigger
    - .rules:on_trigger:always
    - .rules:always_no_mr
  stage: papaya
  needs:
    - job: save:job_id
      artifacts: true
      optional: true

sync_mirror:
  extends: .papaya:sync_mirror
  image: 'cr.ai.cloud.ru/19d74875-55e7-4f05-92d7-5bff1b43b8a0/ci-cd:2026_09_30_commit6e04f4e0'
  variables:
    MIRROR_SOURCE_MODE: 'local'
    MIRROR_PROJECT_PATH: 'learn-llms/mirrors/gift'
    MIRROR_BRANCH: '$CI_COMMIT_BRANCH'
    MIRROR_DRY_RUN: '0'
  rules:
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true
