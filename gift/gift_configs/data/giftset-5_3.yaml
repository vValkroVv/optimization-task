global_seed: 4096
shuffle_seed: ${global_seed}

max_seq_len: 4096

train_loader:
  name: text
  drop_last: true
  num_workers: 4
  prefetch_factor: 1
  persistent_workers: false
  pin_memory: true

  dataset:
    shuffle: true
    max_seq_len: ${max_seq_len}
    shuffle_seed: ${shuffle_seed}
    # fixed canonical nodes count (60 x 640 target nodes): sample order stays independent of node count
    num_canonical_nodes: 38400
    # multiplier for the node-count-derived default; set either this or num_canonical_nodes, not both
    ncn_multiplier: null
    enable_syntax_aware_fim: true
    epoch_size: 3428M  # 14T tokens epoch
    predownload: 100000

    fim_rates:
      vanilla_fim: 0.1
      inline_fim: 0.0
      multiline_fim: 0.0
      syntax_aware_fim: 0.0

    streams:
      # --- GigaSet 5.3 data ---
