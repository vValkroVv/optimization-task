# Fault-tolerant (torchft DiLoCo) llama3 debug run.
#
#   torchrun --nproc_per_node=1 -m torchtitan.train configs/experiments/ft_llama3_debug.yaml
config_version: 1

imports:
  - ../presets/models/llama3/debugmodel.yaml

trainer:
  type: ft

model:
  config: {type: ft/llama3}

fault_tolerance:
  enable: true
  semi_sync_method: diloco
  process_group: nccl
  process_group_timeout_ms: 10000
  sync_steps: 10
  num_fragments: 2

loss:
  type: cross_entropy

profiler:
  enable_profiling: true
  profile_freq: 10
  profiler_active: 10
  profiler_warmup: 0

metrics:
  log_freq: 1

dataloader:
  type: hf_text

optimizer:
  type: ft
  lr: 8.0e-4

lr_scheduler:
  warmup_steps: 2
  decay_ratio: 0.8
  decay_type: linear
  min_lr_factor: 0.0

training:
  local_batch_size: 8
  seq_len: 2048
  steps: 100

checkpoint:
  type: ft
  interval: 10
  last_save_model_only: false

activation_checkpoint:
  mode: selective

comm:
  train_timeout_seconds: 15

validator:
  freq: 5
  steps: 10
