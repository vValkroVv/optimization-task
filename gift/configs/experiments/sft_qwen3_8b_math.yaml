# Qwen3-8B SFT on the GSM8K math dataset.
#
# GSM8K answers carry the worked solution and the final result separated by
# "####", which `split_reasoning` turns into `reasoning_content` + `content`.
#
#   torchrun --nproc_per_node=8 -m torchtitan.train configs/experiments/sft_qwen3_8b_math.yaml
config_version: 1

imports:
  - ../presets/models/qwen3/8b.yaml

hf_assets_path: ./assets/hf/Qwen3-8B

model:
  config:
    blocks:
      dense:
        attention:
          inner_attention: {type: varlen}

loss:
  type: chunked_cross_entropy

dataloader:
  type: hf_chat
  dataset_path: openai/gsm8k
  load_dataset_kwargs:
    name: main
    split: train
  sample_processor: {type: split_reasoning, separator: '####'}

optimizer:
  lr: 2.0e-5

lr_scheduler:
  warmup_steps: 15
  decay_ratio: 0.9
  decay_type: cosine
  min_lr_factor: 0.1

training:
  local_batch_size: 1
  seq_len: 2048
  steps: 180

metrics:
  enable_wandb: true

checkpoint:
  enable: true
  initial_load_in_hf: true

activation_checkpoint:
  mode: selective
