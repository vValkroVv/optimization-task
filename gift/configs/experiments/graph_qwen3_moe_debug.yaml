# Qwen3-MoE debug model through the graph trainer.
#
#   torchrun --nproc_per_node=1 -m torchtitan.train configs/experiments/graph_qwen3_moe_debug.yaml
config_version: 1

imports:
  - qwen3_moe_debug.yaml
  - ../presets/train/graph_trainer.yaml

model:
  label: graph_trainer/qwen3_moe/debugmodel_moe
  config: {type: graph_trainer/qwen3}
