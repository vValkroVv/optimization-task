# FLUX.1 debug model on the bundled cc12m_test corpus.
#
#   torchrun --nproc_per_node=1 -m torchtitan.train configs/experiments/flux_debug.yaml
#
# Offline runs add the CI flags: `--tokenizer.test_mode=true
# --encoder.random_init=true` plus the test encoder and tokenizer paths under
# tests/assets. `training.seq_len` is derived by the trainer from
# dataloader.img_size and tokenizer.max_t5_encoding_len; do not set it.
config_version: 1

imports:
  - ../presets/models/flux/debug.yaml

trainer:
  type: flux

hf_assets_path: tests/assets/tokenizer

loss:
  type: mse

tokenizer:
  t5_tokenizer_path: google/t5-v1_1-xxl
  clip_tokenizer_path: openai/clip-vit-large-patch14
  max_t5_encoding_len: 256

encoder:
  autoencoder_path: assets/hf/FLUX.1-dev/ae.safetensors

metrics:
  log_freq: 1

dataloader:
  type: flux
  prompt_dropout_prob: 0.447
  img_size: 256

optimizer:
  lr: 8.0e-4

lr_scheduler:
  warmup_steps: 1
  decay_ratio: 0.0

training:
  local_batch_size: 4
  max_norm: 2.0
  steps: 10

parallelism:
  context_parallel_degree: 1

activation_checkpoint:
  mode: full

checkpoint:
  interval: 10
  last_save_model_only: false

validator:
  type: flux
  freq: 5
  steps: 48
  sampling:
    enable_classifier_free_guidance: true
    classifier_free_guidance_scale: 5.0
    denoising_steps: 4
  dataloader:
    type: flux
    dataset: coco-validation
    prompt_dropout_prob: 0.0
    img_size: 256
    generate_timesteps: true
  save_img_count: 1
  save_img_folder: img
  all_timesteps: false

inference:
  save_img_folder: inference_results
  prompts_path: ./torchtitan/models/flux/inference/prompts.txt
  local_batch_size: 2
