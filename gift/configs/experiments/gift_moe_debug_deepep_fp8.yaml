# Debug-scale dense + sparse fp8 over DeepEP, on the debugmodel_fp8 preset.
#
#   DG_CACHE_FORCE_SKIP=1 torchrun --nproc_per_node=4 -m torchtitan.train configs/experiments/gift_moe_debug_deepep_fp8.yaml
config_version: 1

imports:
  - gift_moe_debug_deepep.yaml
  - ../presets/models/gift_moe/debugmodel_fp8.yaml
  - ../presets/train/fp8_full.yaml

parallelism:
  expert_parallel_degree: 4

model:
  config:
    blocks:
      mla_moe:
        moe:
          experts:
            token_dispatcher: {type: deepep}
