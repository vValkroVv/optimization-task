# Qwen3-VL debug model on the bundled cc12m_test image-caption corpus.
#
#   torchrun --nproc_per_node=1 -m torchtitan.train configs/experiments/qwen3_vl_debug.yaml
config_version: 1

imports:
  - ../presets/models/qwen3_vl/debugmodel.yaml
  - ../presets/train/debug.yaml
  - ../presets/datasets/cc12m_test_qwen3_vl.yaml

loss:
  type: chunked_cross_entropy

training:
  local_batch_size: 1
  seq_len: 512

checkpoint:
  interval: 10
  last_save_model_only: false

model:
  config: {}
