# DeepSeek-V3 debug model with the hybrid expert-parallel token dispatcher.
#
#   torchrun --nproc_per_node=2 -m torchtitan.train configs/experiments/deepseek_v3_debug_hybridep.yaml
config_version: 1

imports:
  - deepseek_v3_debug.yaml

model:
  config:
    blocks:
      mla_moe:
        moe:
          experts:
            token_dispatcher: {type: hybridep, comm_stream: true, fuse_permute: true}

# HybridEP dispatch needs expert parallelism.
parallelism:
  expert_parallel_degree: 2
