# Model preset: qwen3 "qwen3_moe/30B-A3B".
imports:
  - ../../init/depth_scaled.yaml

model:
  label: qwen3_moe/30B-A3B
  config:
    type: qwen3
    dim: 2048
    vocab_size: 151936
    norm: &norm {type: rmsnorm, eps: 1.0e-06}
    rope: {type: cos_sin, dim: 128, max_seq_len: 262144, theta: 1000000.0}
    blocks:
      moe:
        attention:
          type: gqa
          n_heads: 32
          qk_norm: *norm
          n_kv_heads: 4
          head_dim: 128
        moe:
          experts:
            hidden_dim: 768
            num_experts: 128
            token_dispatcher: {type: local}
          router: {top_k: 8, score_func: softmax, route_norm: true}
        attention_norm: *norm
        ffn_norm: *norm
    layers:
    - {block: moe, repeat: 48}
