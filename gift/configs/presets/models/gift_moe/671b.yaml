# Model preset: gift_moe "671B".
imports:
  - ../../init/gift_base.yaml

model:
  label: 671B
  config:
    type: gift_moe
    dim: 7168
    vocab_size: 129280
    norm: &norm {type: rmsnorm}
    rope: {type: complex, dim: 64, max_seq_len: 4096, theta: 100000.0}
    blocks:
      mla_dense:
        attention: &mla
          type: mla
          n_heads: 128
          kv_norm: {eps: 1.0e-05}
          q_norm: {eps: 1.0e-05}
          q_lora_rank: 1536
          v_head_dim: 192
          kv_lora_rank: 512
          qk_nope_head_dim: 128
          qk_rope_head_dim: 64
        feed_forward: {hidden_dim: 18432}
        attention_norm: *norm
        ffn_norm: *norm
      mla_moe:
        attention: *mla
        moe:
          experts:
            hidden_dim: 2048
            num_experts: 256
            token_dispatcher: {type: local}
          router: {top_k: 8, route_norm: true, route_scale: 2.5, score_func: sigmoid}
          shared_experts: {hidden_dim: 2048}
          router_aux_loss_coef: 0.0001
        attention_norm: *norm
        ffn_norm: *norm
    layers:
    - {block: mla_dense, repeat: 3}
    - {block: mla_moe, repeat: 58}
