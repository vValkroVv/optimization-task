# Model preset: gift_moe "16B".
imports:
  - ../../init/gift_base.yaml

model:
  label: 16B
  config:
    type: gift_moe
    dim: 2048
    vocab_size: 102400
    norm: &norm {type: rmsnorm}
    rope: {type: complex, dim: 64, max_seq_len: 4096, theta: 100000.0}
    blocks:
      mla_dense:
        attention: &mla
          type: mla
          n_heads: 16
          kv_norm: {eps: 1.0e-05}
          v_head_dim: 192
          q_lora_rank: 0
          kv_lora_rank: 512
          qk_nope_head_dim: 128
          qk_rope_head_dim: 64
        feed_forward: {hidden_dim: 10944}
        attention_norm: *norm
        ffn_norm: *norm
      mla_moe:
        attention: *mla
        moe:
          experts:
            hidden_dim: 1408
            num_experts: 64
            token_dispatcher: {type: local}
          router: {top_k: 6, score_func: softmax}
          shared_experts: {hidden_dim: 2816}
          router_aux_loss_coef: 0.0001
        attention_norm: *norm
        ffn_norm: *norm
    layers:
    - {block: mla_dense}
    - {block: mla_moe, repeat: 26}
