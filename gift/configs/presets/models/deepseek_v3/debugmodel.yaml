# Model preset: deepseek_v3 "debugmodel".
imports:
  - ../../init/depth_scaled.yaml

model:
  label: debugmodel
  config:
    type: deepseek_v3
    dim: 256
    vocab_size: 2048
    norm: &norm {type: rmsnorm}
    rope: {type: complex, dim: 64, max_seq_len: 4096, theta: 10000.0}
    blocks:
      mla_dense:
        attention: &mla
          type: mla
          n_heads: 16
          q_lora_rank: 0
          kv_lora_rank: 512
          qk_nope_head_dim: 128
          qk_rope_head_dim: 64
          v_head_dim: 128
        feed_forward: {hidden_dim: 1024}
        attention_norm: *norm
        ffn_norm: *norm
      mla_moe:
        attention: *mla
        moe:
          experts:
            hidden_dim: 256
            num_experts: 8
            token_dispatcher: {type: local}
          router: {top_k: 3, score_func: softmax}
          shared_experts: {hidden_dim: 512}
        attention_norm: *norm
        ffn_norm: *norm
    layers:
    - {block: mla_dense}
    - {block: mla_moe, repeat: 5}
