# Model preset: qwen3_vl "8B".
# The three patch knobs under vision: must match the hf_multimodal dataloader's.
imports:
  - ../../init/depth_scaled.yaml

model:
  label: 8B
  config:
    type: qwen3_vl
    dim: 4096
    vocab_size: 151936
    norm: &norm {type: rmsnorm, eps: 1.0e-06}
    rope: {type: cos_sin, dim: 128, max_seq_len: 32768, theta: 5000000.0}
    vision_encoder:
      dim: 1152
      n_heads: 16
      spatial_merge_size: 2
      num_position_embeddings: 2304
      out_hidden_size: 4096
      deepstack_visual_indices: [8, 16, 24]
      patch_embed: {patch_size: 16, temporal_patch_size: 2}
      blocks:
        vit:
          mlp: {hidden_dim: 4304}
      layers:
      - {block: vit, repeat: 27}
    mrope_section: [24, 20, 20]
    blocks:
      dense:
        attention:
          type: gqa
          n_heads: 32
          qk_norm: *norm
          n_kv_heads: 8
          head_dim: 128
        feed_forward: {hidden_dim: 12288}
        attention_norm: *norm
        ffn_norm: *norm
    layers:
    - {block: dense, repeat: 36}
