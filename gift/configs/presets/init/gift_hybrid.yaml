# Init policy: GIFT hybrids (gift_3_5, gift_4): gated norms start at unit scale, router gates
# renorm their rows.
# A module without its own param_init takes the table of its init_role.
model:
  config:
    init:
      linear:
        weight: {type: normal, std: 0.006, mean: 0.0}
        bias: {type: zeros}
      norm:
        weight: {type: ones}
        bias: {type: zeros}
      embedding:
        weight: {type: normal, std: 0.006, mean: 0.0}
      router_gate:
        weight:
          type: renorm_keep_std
          init: {type: normal, std: 0.006, mean: 0.0}
        bias: {type: zeros}
      gated_norm:
        weight: {type: norm_unit_scale}
        gate_up_weight: {type: normal, std: 0.006, mean: 0.0}
        gate_down_weight: {type: normal, std: 0.006, mean: 0.0}
      experts:
        w13_E2FD: {type: normal, std: 0.006, mean: 0.0}
        w2_EDF: {type: normal, std: 0.006, mean: 0.0}
      conv:
        weight: {type: normal, std: 0.1, mean: 0.0}
      o_norm:
        weight: {type: norm_unit_scale}
      gated_delta:
        A_log: {type: gated_delta_a_log}
        dt_bias: {type: gated_delta_dt_bias}
