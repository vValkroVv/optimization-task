dataloader:
  type: streaming_text
  dataset:
    streams:
    - name: gigasets_4domain
      local: /workspace-SR008.nfs2/vkropotin/optimization-task/runs/production-data-abcd/artifacts/raw/data-002
      split: train
    fim_rates:
      vanilla_fim: 0.0
      inline_fim: 0.0
      multiline_fim: 0.0
      syntax_aware_fim: 0.0
    enable_syntax_aware_fim: false
    shuffle: false
    num_canonical_nodes: 1
    epoch_size: 102400
    partition_algo: orig
    legacy: true
  drop_last: true
  num_workers: 2
  persistent_workers: true
  pin_memory: false
  prefetch_factor: null
  infinite: true
