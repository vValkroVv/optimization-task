config_version: 1

imports:
  - ../../../../../../../../gift/configs/experiments/cuda_graph_campaign_continuation.yaml

debug:
  seed: 42

training:
  steps: 2

optimizer:
  name: AdamW
  implementation: fused

lr_scheduler:
  total_steps: 30000
  warmup_steps: 2000

checkpoint:
  enable: true
  folder: checkpoint
  interval: 1
  async_mode: disabled
  keep_latest_k: 0
  create_seed_checkpoint: false
  initial_load_model_only: false
  initial_load_in_hf: false
  load_step: -1
  load_only: true
  last_save_model_only: false
  save_in_hf: false
  last_save_in_hf: false
  exclude_from_loading: []

callbacks:
  campaign_numerical_probe:
    type: campaign_numerical_probe
    mode: observe
    output_dir: numerical_probe
    updates: 1
