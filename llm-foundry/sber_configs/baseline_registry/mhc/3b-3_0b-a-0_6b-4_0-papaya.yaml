############
### Misc ###
############
max_seq_len: 4096

global_seed: 4096
seed: ${global_seed}
train_loader.dataset.shuffle_seed: ${global_seed}

user: ...
exp_name: ...
run_name: ...

save_folder: /mnt/nfs/07-share/checkpoints/${exp_name}/${run_name}
tensorboard_path: /mnt/nfs/07-share/transfer2cloud/o5/tensorboard/${exp_name}
tokenizer_path: /mnt/nfs/07-share/models_templates/dclm-7b-128k_digit_tokenizer_FIM

tokenizer:
  name: ${tokenizer_path}

vocab_size: 128256
eos_token_id: 2

varlen_input: false
enable_async_tp: false
zero_nan_grads: false

ep_size: 1
tp_size: 1
sp_size: 1
############
### Misc ###
############


#############
### Model ###
#############
model_path: /mnt/nfs/07-share/models_templates/dclm-7b-128k_digit_tokenizer
model:
  name: giga_mix_causal_lm
  init_device: meta
  pretrained: false
  pretrained_model_name_or_path: ${model_path}
  config_overrides:
    # --- Model Size ---
    hidden_size: 1280
    num_hidden_layers: 12

    # --- Vocabulary ---
    vocab_size: ${vocab_size}
    eos_token_id: ${eos_token_id}

    # --- Positional Encoding ---
    max_position_embeddings: ${max_seq_len}
    rope_scaling: null
    rope_theta: 10000

    # --- Initialization ---
    deepseek_init_std: 6.0e-3
    initializer_range: null
    init_type: deepseek
    zero_init_post_attention_norm: true

    # --- Activation ---
    hidden_act: silu

    # --- Normalization ---
    norm_type: GatedNorm
    layernorm_type: pre_post
    rms_norm_eps: 1.0e-6

    # --- Embeddings & LM Head ---
    tie_word_embeddings: false
    lm_head_logit_softcapping: 30.0

    # --- FFN ---
    renorm_router_weights: true
    use_shared_expert_sigmoid: false
    intermediate_size: 896
    dense_intermediate_size: 896
    norm_topk_prob: true
    n_shared_experts: 2
    num_routed_experts: 64
    num_experts_per_tok: 6
    scoring_func: sigmoid
    moe_impl: DeepseekGMMMoeBlock
    drop_by_group_capacity: true
    aux_loss_free: true
    aux_loss_free_strategy: adaptive
    moe_router_bias_update_rate: 1.0e-3
    router_aux_loss_coef: 1.0e-4
    router_seq_aux: true
    router_legacy_weight_init: false
    moe_router_routed_scaling_factor: 2.5
    moe_router_num_groups: null
    moe_router_group_topk: null

    # --- Full Attention ---
    attention_type: LlamaLatentAttention
    num_attention_heads: 16
    num_key_value_heads: 16
    attention_hidden_size: null
    attention_dropout: 0.0
    attention_bias: false
    apply_torch_compile_to_projections: false
    use_custom_rotary_kernel: false
    qk_nope_head_dim: 128
    qk_rope_head_dim: 64
    v_head_dim: 128
    kv_lora_rank: 512
    q_lora_rank: 1536
    num_krope_heads: 1
    gated_attention: true
    use_mla_scaling_factor: true

    # --- Linear Attention ---
    linear_attention_type: Qwen3NextGatedDeltaNet
    full_attention_layers:
      - 3
      - 7
      - 11
    linear_key_head_dim: 128
    linear_value_head_dim: 128
    linear_conv_kernel_dim: 4
    linear_num_key_heads: 8
    linear_num_value_heads: 16
    linear_gating_type: gated_rmsnorm_sigmoid
    linear_attn_o_norm_eps: 1.0e-6
    linear_sigmoid_gate_scale: 2.0
    linear_conv_init_std: 0.1

    # --- MTP ---
    use_mtp: true
    mtp_predictor_num: 1
    mtp_loss_weight: 0.1
    mtp_block_type: dense

    # --- Performance ---
    loss_inplace_backward: true
    delete_logits: true
    use_cache: false
    use_liger: false
    fused_mlp: false
    fused_mlp_checkpoint_lvl: 3
    first_k_dense_replace: 1
    tp_size: ${tp_size}
#############
### Model ###
#############


####################
### Optimization ###
####################
global_train_batch_size: 1280
device_train_microbatch_size: 10
device_eval_batch_size: 16

max_duration: 100000ba
eval_interval: 10000ba

eval_before_train: regular
eval_subset_num_batches: -1

scheduler:
  name: constant_multi_step_with_gamma_with_warmup
  t_warmup: 4000ba
  milestones:
    - 0.8dur
    - 0.9dur
  milestones_gamma:
    - 0.316
    - 0.1

optimizer:
  name: decoupled_adamw
  lr: 8.6e-4
  betas:
    - 0.9
    - 0.95
  eps: 1.0e-20
  weight_decay: 8.6e-5

algorithms:
  gradient_clipping:
    clipping_type: norm
    clipping_threshold: 1.0
####################
### Optimization ###
####################


############
### FSDP ###
############
precision: amp_bf16
dist_timeout: 1800

gigafsdp_config:
  load_monolith_rank0_only: false
  state_dict_type: local
  sync_module_states: false
  all_reduce_grads_across_model_parallel_group: ${enable_async_tp}
  activation_checkpointing: true
  activation_checkpointing_reentrant: false
  hybrid_group_size: 128
  zero_stage: 3
  mixed_precision:
    param_dtype: bf16
    buffer_dtype: fp32
    reduce_dtype: fp32
############
### FSDP ###
############


#################
### Callbacks ###
#################
callbacks:
  stage_time_profiler: {}
  lr_monitor: {}
  memory_monitor: {}
  runtime_estimator: {}

  weight_monitor:
    interval: 200ba
    only_log_wandb: false
    tp_size: ${tp_size}
    stat_list:
      - amax
      - amean
      - l2norm

  activation_monitor:
    interval: 200ba
    only_log_wandb: false
    keep_only_module_types:
      - proj
      - conv
      - lm_head
      - embed_tokens
      - gate
    ignore_module_types:
      - _tp_linear_submodule
    log_module_output: false
    log_gradients: true
    log_grad_input: false
    stat_list:
      - amax
      - amean
      - l2norm

  speed_monitor:
    window_size: 10

  optimizer_monitor:
    batch_log_interval: 200

  scheduled_gc:
    batch_interval: 40

  training_metrics_monitor:
    batch_log_interval: 100

  expert_balancing_monitor:
    batch_log_interval: 40
    activate_h_balance_metrics: false
    activate_per_expert_metrics: false

  token_dispatcher_monitor:
    batch_log_interval: 40
    activate_per_expert_metrics: false
    activate_per_layer_metrics: true
    activate_ep_rank_metrics: false
    activate_eval_metrics: false

  ema_weights:
    alpha: 0.01
    update_period: 10
    start_batch: 10000

  # autometrics:
  #   user: ${user}
  #   eval_interval: ${stable_save_interval}
  #   stable_save_interval: ${stable_save_interval}
  #   nnodes: 4
  #   sglang_tag: custom
  #   debug: true
#################
### Callbacks ###
#################


###############
### Logging ###
###############
use_profiler: false
profiler:
  trace_handlers:
    - name: json
      params:
        folder: /mnt/nfs/07-share/${user}/profiles/${exp_name}/${run_name}/composer_profiler
        merged_trace_filename: null
        merged_trace_remote_file_name: null
        overwrite: true
        num_traces_to_keep: -1
  cyclic_schedule:
    skip_first: 10000000
    wait: 5
    warmup: 2
    active: 1
    repeat: 1
  profiler_overrides:
    torch_prof_folder: /mnt/nfs/07-share/${user}/profiles/${exp_name}/${run_name}/torch_profiler
    torch_prof_overwrite: true
    torch_prof_num_traces_to_keep: -1
    sys_prof_stats_thread_interval_seconds: 0.5
    sys_prof_cpu: false
    sys_prof_memory: false
    sys_prof_disk: false
    sys_prof_net: false
    torch_prof_record_shapes: false
    torch_prof_profile_memory: false
    torch_prof_with_stack: false
    torch_prof_memory_filename: null

progress_bar: false
auto_log_hparams: false
log_to_console: true
console_log_interval: 20ba

date: null
loggers:
  tensorboard:
    log_dir: ${tensorboard_path}
    rank_zero_only: true

autoresume: true
compute_checkpoint_hashes: true
save_checkpoint_async: true
save_interval: 125ba
stable_save_interval: 2000ba
moe_scale_log_interval: 40ba

load_strict_model_weights: false
load_weights_only: false
