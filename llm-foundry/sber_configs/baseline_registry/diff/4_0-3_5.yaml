model:
  config_overrides:
    # --- Initialization ---
    deepseek_init_std: 6.0e-3                      # null → 6.0e-3
    initializer_range: null                        # 6.0e-3 → null
    zero_init_post_attention_norm: true            # null → true

    # --- Normalization ---
    norm_type: GatedNorm                           # ZeroCenteredGatedNorm → GatedNorm

    # --- Embeddings & LM Head ---
    lm_head_logit_softcapping: 30.0                # null → 30.0

    # --- Linear Attention ---
    linear_gating_type: gated_rmsnorm_sigmoid      # gated_rmsnorm_sigmoid_zero_centered → gated_rmsnorm_sigmoid
