eos_token_id: 2

varlen_input: false
enable_async_tp: false
zero_nan_grads: false

ep_size: 1
tp_size: 1
sp_size: 1

model_path: /home/jovyan/ndermolaev/models/Qwen2.5-3B-digits-simple-remapped/
model:
  name: giga_mix_causal_lm
  init_device: meta
  pretrained: false
  pretrained_model_name_or_path: ${model_path}
  config_overrides:
    hidden_size: 448
    num_hidden_layers: 4

    vocab_size: ${vocab_size}
    eos_token_id: ${eos_token_id}

    max_position_embeddings: ${max_seq_len}
    rope_scaling: null
    rope_theta: 100000

    deepseek_init_std: 0.006
    init_type: deepseek
    zero_init_post_attention_norm: true

    hidden_act: silu
    swiglu_limit: 10
    hidden_z_loss_attn_coef: 8.0e-07
    hidden_z_loss_moe_coef: 8.714285714e-07
    hidden_z_loss_dense_mlp_coef: 3.0e-07
    hidden_z_loss_eps: 0.0
    router_z_loss_eps: 0.0
    z_loss_eps: 0.0

    norm_type: GatedNorm
    layernorm_type: pre_post
    rms_norm_eps: 1.0e-06

    tie_word_embeddings: false
    lm_head_logit_softcapping: 30.0

    renorm_router_weights: true
    use_shared_expert_sigmoid: false
    intermediate_size: 128
    dense_intermediate_size: 1152
    norm_topk_prob: true
    num_routed_experts: 256
    num_experts_per_tok: 8
    n_shared_experts: 1
    scoring_func: sigmoid
    moe_impl: DeepseekGMMMoeBlock
    drop_by_group_capacity: true
    dispatcher_balancing_strategy: fixed_capacity
    expert_capacity_tokens: 16000
    aux_loss_free: true
    aux_loss_free_strategy: adaptive
    moe_router_bias_update_rate: 0.001
    router_aux_loss_coef: 0.0001
    router_seq_aux: true
    router_legacy_weight_init: false
    moe_router_routed_scaling_factor: 2.5
    moe_router_num_groups: null
    moe_router_group_topk: null

    attention_type: LlamaLatentAttention
    num_attention_heads: 4
    num_key_value_heads: 4
    attention_hidden_size: null
    attention_dropout: 0.0
    attention_bias: false
    apply_torch_compile_to_projections: false
    use_custom_rotary_kernel: false
    qk_nope_head_dim: 128
    qk_rope_head_dim: 64
    v_head_dim: 128
    q_lora_rank: 96
    kv_lora_rank: 256
    num_krope_heads: 1
    gated_attention: true
    use_mla_scaling_factor: true

    linear_attention_type: Qwen3NextGatedDeltaNet
    full_attention_layers:
    - 3
    linear_key_head_dim: 128
    linear_value_head_dim: 128
    linear_conv_kernel_dim: 4
    linear_num_key_heads: 2
    linear_num_value_heads: 4
    linear_gating_type: gated_rmsnorm_sigmoid
    linear_attn_o_norm_eps: 1.0e-06
    linear_sigmoid_gate_scale: 2.0
    linear_conv_init_std: 0.1

    use_mtp: true
    mtp_predictor_num: 1
    mtp_loss_weight: 0.1
    mtp_block_type: dense

    loss_reduction_mode: batch
    loss_inplace_backward: true
    delete_logits: true
    use_cache: false
    use_liger: true
    fused_mlp: false
    fused_mlp_checkpoint_lvl: 3
    dense_fused_mlp_checkpoint_lvl: 2
    first_k_dense_replace: 1
    tp_size: ${tp_size}
    pretraining_tp: 1

    use_float8_grouped_gemm: false
    use_new_expert_weight_layout: true
    float8_quantize_at_boundary: false
    float8_dense_fused_swiglu_quant: false
    float8_deep_gemm_num_sms: 116
    moe_enable_deepep: false
    moe_deepep_num_sms: 20

scheduler:
  name: constant_with_warmup
  t_warmup: 250ba
  alpha: 1

optimizer:
  name: decoupled_adamw
  lr: 0.001
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-20
  weight_decay: 1.0e-04
  per_fqn_overrides:
  - param_str_match: A_log|dt_bias
    wd_mult: 0.0

algorithms:
  gradient_clipping:
    clipping_type: norm
    clipping_threshold: 1.0

precision: amp_bf16
dist_timeout: 1800

gigafsdp_config:
  load_monolith_rank0_only: false
  state_dict_type: local
  sync_module_states: false
  all_reduce_grads_across_model_parallel_group: ${enable_async_tp}
  activation_cpu_offload: false
  activation_checkpointing: false
  activation_checkpointing_reentrant: false
  sac_strategy: 0
  float8_all_gather_on_experts: false
  hybrid_group_size: 1
  zero_stage: 1
  alignment_value: 128
  mixed_precision:
    param_dtype: bf16
    buffer_dtype: fp32
    reduce_dtype: fp32

callbacks:
  stage_time_profiler: {}
  lr_monitor: {}
  memory_monitor: {}
  runtime_estimator: {}

  speed_monitor:
    window_size: 10

  optimizer_monitor:
    batch_log_interval: 480

  optimizer_health_monitor:
    batch_log_interval: 40

  scheduled_gc:
    batch_interval: 40

  training_metrics_monitor:
    batch_log_interval: 120

  expert_balancing_monitor:
    batch_log_interval: 40
    weight_norm_log_interval: 480
    activate_h_balance_metrics: false
    activate_per_expert_metrics: false
    activate_activation_norms: true
    activate_expert_weight_norms: true

  token_dispatcher_monitor:
    batch_log_interval: 40
    activate_per_expert_metrics: false
    activate_per_layer_metrics: true
    activate_ep_rank_metrics: false
    activate_eval_metrics: false

  update_weight_ratio_monitor:
    batch_log_interval: 240
    log_level: fqn

  router_margin_monitor:
    batch_log_interval: 40
    near_m: 4
    ema_decay: 0.9

  topk_accuracy_monitor:
    batch_log_interval: 40
    k_values:
    - 1
    - 5
    - 20

  weight_monitor:
    interval: 480ba
    only_log_wandb: false
    tp_size: ${tp_size}
    stat_list:
    - amax
    - amean
    - l2norm

  activation_monitor:
    interval: 480ba
    only_log_wandb: false
    keep_only_module_types:
      - proj
      - conv
      - lm_head
      - embed_tokens
      - gate
    ignore_module_types:
      - _tp_linear_submodule
    log_module_output: false
    log_gradients: true
    log_grad_input: false
    stat_list:
      - amax
      - amean
      - l2norm

  ema_weights:
    alpha: 0.01
    update_period: 1
    start_batch: 1400

  autometrics:
    user: ${user}
    internet: false
    eval_interval: ${stable_save_interval}
    stable_save_interval: ${callbacks.autometrics.eval_interval}
    nnodes: 1
    n_gpus: 1
    sglang_tag: custom
    max_retry: null
    debug: true

use_profiler: false
profiler:
