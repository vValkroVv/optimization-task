# L8 baseline template: GBS384, LR7e-4, one exclusive 8-GPU node, MBS12.
# Derived from the historical GBS384/LR7e-4 recipe, with KV rank256 and fixed shuffle seed.
# Reconstructed sweeps live under sber_scripts/analytics/experimentation/.
# Full budget: 40,000 optimizer steps = 62,914,560,000 tokens at context4096.
# Replace the two OmegaConf mandatory values (???) before preparing a run:
#   seed: integer training RNG seed (initialization and other stochastic work).
#   run_name: unique filesystem-safe name for an independent training run.
# Keep shuffle_seed fixed at 4096 across the multi-seed series.
# Keeping shuffle_seed fixed does not isolate initialization from FIM randomness.
# Example identity: l8-baseline-gbs384-lr7e-4-seed123-shuffle4096-r1.
# A fresh run needs an unused save_folder and no inherited load_path override.
# TensorBoard also appends run_name to its shared log_dir; do not reuse identities.
# Keep the same identity and seeds only when recovering that same run.
# autoresume restores full state for recovery, not independent seed trials.
# Do not use the historical sweep/resume launcher for new baseline runs.
# Paths below target the existing O5 environment; this is not a portable config.
# Use TrainJobLLMF; middle partition and Requeue=1 are launcher/scheduler settings.
# EMA is already enabled; checkpoint conversion already requests EMA weights.
# Periodic autometrics remain enabled unchanged, and debug:true is not a dry run.
# Verify evaluation readiness separately before relying on benchmark results.

max_seq_len: 4096

seed: ???
shuffle_seed: 4096

user: profitrating
exp_name: l8-1_5b-a-0_3b
run_name: ???

save_folder: /mnt/nfs-extra/09-extra/pretrain/checkpoints/base/${exp_name}/${run_name}
tensorboard_path: /mnt/nfs/07-share/transfer2cloud/o5/tensorboard/${exp_name}
tokenizer_path: /mnt/nfs/07-share/models_templates/dclm-7b-128k_digit_tokenizer_FIM

tokenizer:
  name: ${tokenizer_path}

vocab_size: 128256
eos_token_id: 2

varlen_input: false
enable_async_tp: false
zero_nan_grads: false

ep_size: 8 # L8: 8
tp_size: 1 # L8: 1
sp_size: 1 # L8: 1

model_path: /mnt/nfs/07-share/models_templates/dclm-7b-128k_digit_tokenizer
model:
  name: papaya_mix_causal_lm
  init_device: meta
  pretrained: false
  pretrained_model_name_or_path: ${model_path}
  config_overrides:
    hidden_size: 896 # L8: 896
    num_hidden_layers: 8 # L8: 8

    vocab_size: ${vocab_size}
    eos_token_id: ${eos_token_id}

    max_position_embeddings: ${max_seq_len}
    rope_scaling: null
    rope_theta: 100000

    deepseek_init_std: 6.0e-3 # L8: 6.0e-3
    init_type: deepseek
    zero_init_post_attention_norm: true

    hidden_act: silu
    swiglu_limit: 10
    hidden_z_loss_attn_coef: 8.0e-7 # L8: 8.0e-7
    hidden_z_loss_moe_coef: 8.714285714e-7 # L8: 8.714285714e-7
    hidden_z_loss_dense_mlp_coef: 3.0e-7 # L8: 3.0e-7
    hidden_z_loss_eps: 0.0
    router_z_loss_eps: 0.0
    z_loss_eps: 0.0

    norm_type: GatedNorm
    layernorm_type: pre_post
    rms_norm_eps: 1.0e-6

    tie_word_embeddings: false
    lm_head_logit_softcapping: 30.0

    renorm_router_weights: true
    use_shared_expert_sigmoid: false
    intermediate_size: 256 # L8: 256
    dense_intermediate_size: 2304 # L8: 2304
    norm_topk_prob: true
    num_routed_experts: 256
    num_experts_per_tok: 8
    n_shared_experts: 1
    scoring_func: sigmoid
    moe_impl: DeepseekGMMMoeBlock
    drop_by_group_capacity: true
    dispatcher_balancing_strategy: fixed_capacity
    expert_capacity_tokens: 16000 # matched to device_train_microbatch_size=12
    aux_loss_free: true
    aux_loss_free_strategy: adaptive
    moe_router_bias_update_rate: 1.0e-3
    router_aux_loss_coef: 1.0e-4
    router_seq_aux: true
    router_legacy_weight_init: false
    moe_router_routed_scaling_factor: 2.5
    moe_router_num_groups: null
    moe_router_group_topk: null

    attention_type: LlamaLatentAttention
    num_attention_heads: 8 # L8: 8
    num_key_value_heads: 8 # L8: 8
    attention_hidden_size: null
    attention_dropout: 0.0
    attention_bias: false
    apply_torch_compile_to_projections: false
    use_custom_rotary_kernel: false
    qk_nope_head_dim: 128
    qk_rope_head_dim: 64
    v_head_dim: 128
    q_lora_rank: 192 # L8: 192
    kv_lora_rank: 256 # L8: 256
    num_krope_heads: 1
    gated_attention: true
    use_mla_scaling_factor: true

    linear_attention_type: Qwen3NextGatedDeltaNet
    full_attention_layers: # L8: [3,7]
    - 3
    - 7
    linear_key_head_dim: 128
    linear_value_head_dim: 128
    linear_conv_kernel_dim: 4
    linear_num_key_heads: 4 # L8: 4
    linear_num_value_heads: 8 # L8: 8
    linear_gating_type: gated_rmsnorm_sigmoid
    linear_attn_o_norm_eps: 1.0e-6
    linear_sigmoid_gate_scale: 2.0
    linear_conv_init_std: 0.1

    use_mtp: true
    mtp_predictor_num: 1
    mtp_loss_weight: 0.1
    mtp_block_type: dense

    loss_reduction_mode: batch
    loss_inplace_backward: true
    delete_logits: true
    use_cache: false
    use_liger: true
    fused_mlp: false
    fused_mlp_checkpoint_lvl: 3
    dense_fused_mlp_checkpoint_lvl: 2
    first_k_dense_replace: 1 # L8: 1
    tp_size: ${tp_size}
    pretraining_tp: 1

    use_float8_grouped_gemm: false
    use_new_expert_weight_layout: true
    float8_quantize_at_boundary: false
    float8_dense_fused_swiglu_quant: false
    float8_deep_gemm_num_sms: 116
    moe_enable_deepep: false
    moe_deepep_num_sms: 20

fp8_config:
  include_linear_layers: .*\.(down_proj|gate_proj|up_proj|o_proj|qkv_proj|z_proj)$
  include_shared_quantizers: .*\.(shared_experts|mlp)$

global_train_batch_size: 384
device_train_microbatch_size: 12
device_eval_batch_size: ${device_train_microbatch_size} # L8: ...

max_duration: 40000ba # Full 62,914,560,000-token pretraining budget.
eval_interval: 0 # Built-in Trainer evaluation is off; autometrics remain enabled.

eval_before_train: skip
eval_subset_num_batches: -1

scheduler:
  name: constant_with_warmup
  t_warmup: 1000ba # 1,572,864,000 tokens; full-state recovery preserves warmup progress.
  alpha: 1

optimizer:
  name: decoupled_adamw
  lr: 0.0007
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-20
  weight_decay: 7.0e-05 # 0.1 * peak lr; per optimizer step.
  per_fqn_overrides:
  - param_str_match: A_log|dt_bias
    wd_mult: 0.0

algorithms:
  gradient_clipping:
    clipping_type: norm
    clipping_threshold: 1.0

precision: amp_bf16
dist_timeout: 1800

papayafsdp_config:
  load_monolith_rank0_only: false
  state_dict_type: local
  sync_module_states: false
  all_reduce_grads_across_model_parallel_group: ${enable_async_tp}
  activation_cpu_offload: false
  activation_checkpointing: false
  activation_checkpointing_reentrant: false
  sac_strategy: 0
  float8_all_gather_on_experts: false
  hybrid_group_size: 8 # L8: 8
  zero_stage: 1 # fixed
  alignment_value: 128
  mixed_precision:
    param_dtype: bf16
    buffer_dtype: fp32
    reduce_dtype: fp32

callbacks:
  stage_time_profiler: {}
  lr_monitor: {}
  memory_monitor: {}
  runtime_estimator: {}

  speed_monitor:
    window_size: 10

  optimizer_monitor:
    batch_log_interval: 480

  optimizer_health_monitor:
    batch_log_interval: 40

  scheduled_gc:
    batch_interval: 40

  training_metrics_monitor:
    batch_log_interval: 120

  expert_balancing_monitor:
    batch_log_interval: 40
    weight_norm_log_interval: 480
    activate_h_balance_metrics: false
    activate_per_expert_metrics: false
    activate_activation_norms: true
    activate_expert_weight_norms: true

  token_dispatcher_monitor:
    batch_log_interval: 40
    activate_per_expert_metrics: false
    activate_per_layer_metrics: true
    activate_ep_rank_metrics: false
    activate_eval_metrics: false

  update_weight_ratio_monitor:
    batch_log_interval: 240
    log_level: fqn

  router_margin_monitor:
    batch_log_interval: 40
    near_m: 4
    ema_decay: 0.9

  topk_accuracy_monitor:
    batch_log_interval: 40
    k_values:
    - 1
    - 5
    - 20

  weight_monitor:
    interval: 480ba
    only_log_wandb: false
    tp_size: ${tp_size}
    stat_list:
    - amax
    - amean
    - l2norm

  activation_monitor:
    interval: 480ba
    only_log_wandb: false
    keep_only_module_types:
      - proj
      - conv
      - lm_head
      - embed_tokens
      - gate
    ignore_module_types:
      - _tp_linear_submodule
    log_module_output: false
    log_gradients: true
    log_grad_input: false
    stat_list:
      - amax
      - amean
      - l2norm

  ema_weights:
    alpha: 0.01
    update_period: 5
    start_batch: 4000 # 6,291,456,000 tokens: 10% of this full pretraining budget.

  autometrics:
    user: ${user}
    internet: false
    eval_interval: ${stable_save_interval}
    stable_save_interval: ${stable_save_interval}
    nnodes: 1 # L8: 1
    extra_mounts: /mnt/nfs-extra:/mnt/nfs-extra
    sglang_tag: custom
    max_retry: null
    debug: true

use_profiler: false
profiler:
  trace_handlers:
    - name: json
      params:
        folder: /mnt/nfs/07-share/${user}/profiles/${exp_name}/${run_name}/composer_profiler
        merged_trace_filename: null
        merged_trace_remote_file_name: null
        overwrite: true
        num_traces_to_keep: -1
  cyclic_schedule:
    skip_first: 10000000
    wait: 5
    warmup: 2
    active: 1
    repeat: 1
  profiler_overrides:
    torch_prof_folder: /mnt/nfs/07-share/${user}/profiles/${exp_name}/${run_name}/torch_profiler
    torch_prof_overwrite: true
    torch_prof_num_traces_to_keep: -1
    sys_prof_stats_thread_interval_seconds: 0.5
    sys_prof_cpu: false
    sys_prof_memory: false
    sys_prof_disk: false
    sys_prof_net: false
    torch_prof_record_shapes: false
    torch_prof_profile_memory: false
    torch_prof_with_stack: false
    torch_prof_memory_filename: null

progress_bar: false
auto_log_hparams: false
log_to_console: true
console_log_interval: 10ba

date: null
loggers:
  tensorboard:
    log_dir: ${tensorboard_path}
    rank_zero_only: true

autoresume: true
compute_checkpoint_hashes: true
save_checkpoint_async: true
save_interval: 400ba # Every 629,145,600 tokens, plus the final training checkpoint.
stable_save_interval: 2000ba
moe_log_interval: 40

load_strict_model_weights: false
load_weights_only: false

