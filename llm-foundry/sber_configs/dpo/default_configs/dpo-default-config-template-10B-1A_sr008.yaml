user:

exp_name:
run_name:

tensorboard_path: /home/jovyan/${user}/tensorboard/${exp_name}
save_folder: /home/jovyan/${user}/checkpoints/${exp_name}/${run_name}
logs_path: ${tensorboard_path}

dpo_mode: true

max_seq_len: 8192

global_seed: 42

eos_token_id: 2
speedup_llama: false
varlen_input: false
zero_nan_grads: false

enable_async_tp: false
tp_size: 1
sp_size: 1
num_attention_heads: 32

model:
  name: dpo
  dpo:
    beta_chosen: 0.05
    beta_rejected: 0.05
    gamma: 0.0
    weighted_gamma: 1.0
    n_tokens: -1
    margin_coef: 0.0
    spectokens: [42001, 42002]
    masked_tokens: []
    chosen_nll_coef: 0.25
    shiza_nll_coef: 0.95
    spectokens_nll_coef: 0
    loss_coef: 1.0
    loss_func: dpo
    chosen_nll_norm: ref
    func_shiza: true
    mask_common_prefix: false
    log_metrics: true
  student_model:
    config_overrides:
      sp_split_type: zigzag
      activation_checkpoint_layers_num: 35
      attention_bias: false
      attention_dropout: 0.0
      attention_hidden_size: null
      attention_type: LlamaLatentAttention
      apply_torch_compile_to_projections: false
      use_custom_rotary_kernel: false
      qk_nope_head_dim: 128
      qk_rope_head_dim: 64
      v_head_dim: 192
      kv_lora_rank: 512
      q_lora_rank: 0
      num_krope_heads: 1
      use_mtp: true
      mtp_predictor_num: 1
      mtp_loss_weight: 0.1
      bos_token_id: 1
      eos_token_id: 2
      # freeze_non_embed: true #false # NOTE: такого аргумента нет в актуальном конфиге
      fused_mlp: false # HOTFIX: иначе ошибка в MoE слоях
      # fused_mlp_checkpoint_lvl: 3 # HOTFIX
      activation_checkpoint_layers_num: null
      hidden_act: silu
      hidden_size: 1536
      initializer_range: 0.006
      dense_intermediate_size: 8960
      loss_inplace_backward: true
      max_position_embeddings: 131072
      num_attention_heads: 32
      num_hidden_layers: 26
      num_key_value_heads: 32
      parallel_embedding_type: EmbeddingParallelEmbedding
      rms_norm_eps: 1.0e-05
      rope_scaling:
        factor: 40.0
        beta_fast: 32.0
        beta_slow: 1.0
        mscale: 1.0
        mscale_all_dim: 1.0
        original_max_position_embeddings: 4096
        rope_type: yarn
      rope_theta: 100000.0
      tie_word_embeddings: false
      use_cache: false
      moe_impl: DeepseekGMMMoeBlock
      first_k_dense_replace: 1
      intermediate_size: 1280
      n_shared_experts: 1
      num_routed_experts: 64
      num_experts_per_tok: 4
      norm_topk_prob: true
      aux_loss_free: true
      aux_loss_free_strategy: adaptive
      router_aux_loss_coef: 0.0001
      moe_router_bias_update_rate: 0.001
      router_legacy_weight_init: false
      drop_by_group_capacity: true
      scoring_func: sigmoid
      use_liger: false
      tp_size: ${tp_size}
      vocab_size: 128256
      moe_enable_deepep: true
    name: giga_mix_causal_lm
    # init_device: meta # HOTFIX: не работает подгрузка чекпов
    init_device: cpu # HOTFIX: не работает подгрузка чекпов
    pretrained: false
    pretrained_model_name_or_path: ${model_path}
  teacher_model:
    same_as_student: true


eval_first: true
eval_subset_num_batches: 10

train_loader:
  max_seq_len: ${max_seq_len}
  name: text
  dpo_data: true
  eos_token_id: ${eos_token_id}
  sft_mode: false
  dataset:
    epoch_size: 379810  # вынести
    streams:
        dpo_main:
          split: mds
    shuffle: true
    max_seq_len: ${max_seq_len}
    shuffle_seed: ${global_seed}
  drop_last: true
  num_workers: 128

scheduler: # вынести
  name: constant_multi_step_with_gamma_with_warmup
  t_warmup: 50ba
  milestones: [3061ba, 4920ba]
  milestones_gamma: [0.2, 0.04]

optimizer:
  name: decoupled_adamw
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  weight_decay: 0

algorithms:
  gradient_clipping:
    clipping_type: norm
    clipping_threshold: 1.0

icl_tasks:
# - dataset_uri: /home/jovyan/vmamedov/mmlu/all
- dataset_uri: /workspace-SR008.nfs2/metrics/mmlu
  label: mmlu
  gauntlet_tags:
  - en
  icl_task_type: mmlu
  max_seq_len: 4096
  num_fewshot:
  - 0
  - 5
  num_workers: 1
  persistent_workers: false
  pin_memory: true
  prefetch_factor: 2

use_profiler: false
profiler:
  trace_handlers:
    - name: json
      params:
        folder: ${logs_path}/composer_profiler/
        overwrite: true
        num_traces_to_keep: -1
  cyclic_schedule:
    skip_first: 86050
    wait: 10
    warmup: 2
    active: 2
    repeat: 1
  profiler_overrides:
    torch_prof_overwrite: true
    torch_prof_num_traces_to_keep: -1
    sys_prof_stats_thread_interval_seconds: 0.5
    sys_prof_cpu: false
    sys_prof_memory: false
    sys_prof_disk: false
    sys_prof_net: false
    torch_prof_record_shapes: false
    torch_prof_profile_memory: false
    torch_prof_with_stack: false
    torch_prof_memory_filename: null

seed: ${global_seed}
precision: amp_bf16
dist_timeout: 7200

gigafsdp_config:
  load_monolith_rank0_only: false
  state_dict_type: local
  sync_module_states: false
  activation_checkpointing: true
  activation_checkpointing_reentrant: false
  hybrid_group_size: 32
  load_monolith_rank0_only: false
  mixed_precision:
    buffer_dtype: fp32
    param_dtype: bf16
    reduce_dtype: fp32


progress_bar: true
log_to_console: true
console_log_interval: 1ba

callbacks:
  ema_weights:
    alpha: 0.01
    update_period: 10
    start_batch: 1
  speed_monitor:
    window_size: 10
  lr_monitor: {}
  memory_monitor: {}
  stage_time_profiler: {}
  runtime_estimator: {}
  optimizer_monitor:
    batch_log_interval: 10
  scheduled_gc:
    batch_interval: 10
  training_metrics_monitor:
    batch_log_interval: 500
  stage_time_profiler: {}
  expert_balancing_monitor:
    batch_log_interval: 10
  token_dispatcher_monitor:
    batch_log_interval: 10
    activate_per_expert_metrics: false
    activate_per_layer_metrics: true
    activate_ep_rank_metrics: false
  activation_monitor:
    interval: 100ba
    only_log_wandb: false
    keep_only_module_types: ['qkv_proj', 'o_proj', 'down_proj']
    ignore_module_types: ['_tp_linear_submodule']
    log_module_output: false # log module output or not (by default we log only input to selected modules)
    log_gradients: true
    log_grad_input: false # log grad_input at backward or not (by default we log only grad_output of selected modules)
    stat_list: ['amax', 'amean'] # 'min
auto_log_hparams: true
autoresume: true

save_checkpoint_async: false
load_weights_only: true