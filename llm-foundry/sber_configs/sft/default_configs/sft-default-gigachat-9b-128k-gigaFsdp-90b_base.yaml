# max_seq_len: 8192 # In editable CFG
global_seed: 42
use_profiler: false
enable_async_tp: false
# EXP_NAME
# from submit_train.py
# exp_name: GigaR-29b-24.4-mini # In editable CFG
eos_token_id: 2

patch_flash: false
zero_nan_grads: false
varlen_input: false
sft_mode: true

# Model LLaMa-7B
model_path: /home/jovyan/lora_api_service_models/GigaChat-2-Lite-128k/GigaChat-2-Lite-128k-hf/models/
model:
  name: gigar_causal_lm
  init_device: meta #meta
  pretrained: false
  pretrained_model_name_or_path: ${model_path}
  config_overrides:
    attention_type: LlamaPackedAttention
    tp_size: ${tp_size}
    num_hidden_layers: 35
    vocab_size: 128256
  varlen_input: false


# FULL SHARD
# global_train_batch_size: 480   # In editable CFG
# device_train_microbatch_size: 1 # global_train_batch_size = GPU * grad_accum * device_train_microbatch_size
# device_eval_batch_size: 1


# Tokenizer
tokenizer:
  # name: /home/jovyan/isstolbov/gigar_gigafunc_data_24_3_29b/rugpt-lora-pipeline/sft_data_loaders/tokenizer_functions # In editable CFG
  kwargs:
    model_max_length: ${max_seq_len}
    legacy: true
    use_fast: false

# Dataloaders
train_loader:
  name: text
  eos_token_id: ${eos_token_id}
  sft_mode: ${sft_mode}
  dataset:
    # In editable CFG
    # epoch_size: 401839 # = batch_size * num_steps # надо менять
    # streams:
    #   v24-4-mini:  # надо менять
    #     local: /home/jovyan/shakirov_emil/rnd-data-catalog/data_catalog/text/001_instruct_datasets_versioned/v24_4/data/SFT/mini_mds
    #     proportion: 1.0
    #     split: mds
    shuffle: true
    max_seq_len: ${max_seq_len}
    shuffle_seed: ${global_seed}
  drop_last: true
  num_workers: 16

# Optimization
scheduler:
  name: cosine_with_warmup
  t_warmup: 50ba
  alpha_f: 0


optimizer:
  name: decoupled_adamw
  # lr: 7.7e-7
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  weight_decay: 0.0  # wd_article * lr

# Algorithms
algorithms:
  gradient_clipping:
    clipping_type: norm
    clipping_threshold: 1.0

# BENCHMARKS
icl_tasks:
 - label: mmlu
   dataset_uri: /home/jovyan/lora_api_service_models/lora_llm_learner/metrics/short_version/mmlu_small
   # each num_fewshot is separate dataloader
   num_fewshot: [0, 5]
   icl_task_type: mmlu
   ####################
   # only for mmlu
   # be careful, because the settings
   # applied to all dataloaders in this tasks
   num_workers: 1
   pin_memory: true
   prefetch_factor: 2
   persistent_workers: false
   max_seq_len: 8192
   has_categories: ${sft_mode}
  #  has_categories: false
   sft_args:
    system_precursor: ""
    user_precursor: ""
    assistant_precursor: ""
    sentinel_token: ""

use_profiler: false
profiler:
  trace_handlers:
    - name: json
      params:
      # composer.profiler.JSONTraceHandler kwargs
        folder: '/home/jovyan/vadim_v/tensorboard_sft/${exp_name}/composer_profiler'
        merged_trace_filename: null
        merged_trace_remote_file_name: null
        overwrite: true
        num_traces_to_keep: -1

  cyclic_schedule:
    # composer.profiler.cyclic_schedule kwargs
    #  Number of batches to skip profiling at epoch start
    skip_first: 5
    #  For each profiling cycle, number of batches to skip at the beginning of the cycle.
    wait: 0
    #  For each profiling cycle, number of batches to be in the warmup state after skipping
    #   ``wait`` batches
    warmup: 1
    #  For each profiling cycle, number of batches to record after warming up.
    active: 1
    #  Number of profiling cycles to perform per epoch
    repeat: 1

  profiler_overrides:
    # composer.profiler.Profiler kwargs
    # BASE
    torch_prof_folder: '/home/jovyan/vadim_v/tensorboard_sft/${exp_name}/torch_profiler'
    torch_prof_overwrite: true
    torch_prof_num_traces_to_keep: -1
    sys_prof_stats_thread_interval_seconds: 0.5
    # METRICS
    # sys
    sys_prof_cpu: false
    sys_prof_memory: false
    sys_prof_disk: false
    sys_prof_net: false
    # torch
    torch_prof_record_shapes: false
    torch_prof_profile_memory: false
    torch_prof_with_stack: false
    torch_prof_memory_filename: null
    torch_prof_memory_remote_file_name: null


# max_duration: 5ep # In editable CFG
# eval_interval: 418ba
eval_first: true
eval_subset_num_batches: -1

# System
seed: ${global_seed}
precision: amp_bf16 #amp_fp16
dist_timeout: 36000

gigafsdp_config:
  tp_size: ${tp_size}
  load_monolith_rank0_only: false
  state_dict_type: local
  sync_module_states: false
  # --- optional gigafsdp params ---
  # hpz_first_layers_num: 40
  # hpz_group_size: 4
  # hybrid_group_size: 256
  

  activation_checkpointing: true
  activation_checkpointing_reentrant: false
  mixed_precision:
    param_dtype: bf16
    buffer_dtype: fp32
    reduce_dtype: fp32

# FSDP
# fsdp_config:
#   gigafsdp_enabled: true
#   load_monolith_rank0_only: false
#   state_dict_type: local
#   activation_checkpointing_reentrant: false

#   sync_module_states: true
#   use_orig_params: false
#   sharding_strategy: FULL_SHARD # SHARD_GRAD_OP  
#   mixed_precision: 
#     param_dtype: bf16 #bf16
#     reduce_dtype: fp32 
#     buffer_dtype: fp32 
#   activation_cpu_offload: false
#   activation_checkpointing: true
#   limit_all_gathers: false
#   forward_prefetch: true
#   verbose: false
#   tp_size: ${tp_size}
#   backward_prefetch: BACKWARD_PRE
#   # forward_prefetch: false

# Logging
progress_bar: true
log_to_console: true
console_log_interval: 1ba

callbacks:
  speed_monitor:
    window_size: 10
  lr_monitor: {}
  memory_monitor: {}
  runtime_estimator: {}
  optimizer_monitor:
    batch_log_interval: 100
  scheduled_gc:
    batch_interval: 100
  training_metrics_monitor:
    batch_log_interval: 500

auto_log_hparams: true
autoresume: true

# Checkpoint to local filesystem or remote object store
# save_interval: 418ba
# save_num_checkpoints_to_keep: 1  # Important, this cleans up checkpoints saved to DISK

load_strict_model_weights: false

load_weights_only: true
