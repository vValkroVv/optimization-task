# max_seq_len: 8192 # In editable CFG
global_seed: 42
use_profiler: false
enable_async_tp: false
# EXP_NAME
# from submit_train.py
# exp_name: GigaR-29b-24.4-mini # In editable CFG
eos_token_id: 2
#eval_before_train: regular
patch_flash: false
zero_nan_grads: false
varlen_input: false
sft_mode: true

# Model LLaMa-7B
model_path: /home/jovyan/lora_api_service_models/GigaR-9b-128k-v28_2-v2-320gbs-bf16-batched-const-fixed-new-data-3-marta/gigar-base_model-9B-128k_digit_tokenizer-no_eos-config_only
model:
  config_overrides:
    activation_checkpoint_layers_num: 35
    attention_bias: false
    attention_dropout: 0.0
    attention_hidden_size: null
    attention_type: LlamaPackedAttention
    bos_token_id: 1
    eos_token_id: 2
    freeze_non_embed: false
    fused_mlp: true
    fused_mlp_checkpoint_lvl: 3
    hidden_act: silu
    hidden_size: 3584
    initializer_range: 0.02
    intermediate_size: 18944
    loss_inplace_backward: true
    max_position_embeddings: 131072
    num_attention_heads: 28
    num_hidden_layers: 35
    num_key_value_heads: 4
    parallel_embedding_type: EmbeddingParallelEmbedding
    rms_norm_eps: 1.0e-06
    rope_scaling:
      factor: 4.0
      high_freq_factor: 4.0
      low_freq_factor: 1.0
      original_max_position_embeddings: 32768
      rope_type: llama3
    rope_theta: 2800000.0
    tie_word_embeddings: false
    tp_size: ${tp_size}
    vocab_size: 128256
  init_device: meta
  name: gigar_causal_lm
  pretrained: false
  pretrained_model_name_or_path: ${model_path}
progress_bar: false
# FULL SHARD
# global_train_batch_size: 480   # In editable CFG
# device_train_microbatch_size: 1 # global_train_batch_size = GPU * grad_accum * device_train_microbatch_size
# device_eval_batch_size: 1


# Tokenizer
tokenizer:
  #name: /home/jovyan/lora_api_service_models/GigaR-9b-128k-v28_2-v2-320gbs-bf16-batched-const-fixed-new-data-3-marta/tokenizer # In editable CFG
  name: /home/jovyan/lora_api_service_models/GigaR-9b-128k-v28_2-v2-320gbs-bf16-batched-const-fixed-new-data-3-marta/tokenizer_pretrain/
  kwargs:
    model_max_length: ${max_seq_len}
    legacy: true
    use_fast: false

# Dataloaders
train_loader:
  name: text
  eos_token_id: ${eos_token_id}
  sft_mode: ${sft_mode}
  dataset:
    # In editable CFG
    # epoch_size: 401839 # = batch_size * num_steps # надо менять
    # streams:
    #   v24-4-mini:  # надо менять
    #     local: /home/jovyan/shakirov_emil/rnd-data-catalog/data_catalog/text/001_instruct_datasets_versioned/v24_4/data/SFT/mini_mds
    #     proportion: 1.0
    #     split: mds
    shuffle: true
    max_seq_len: ${max_seq_len}
    shuffle_seed: ${global_seed}
  drop_last: true
  num_workers: 16

# Optimization
scheduler:
  name: cosine_with_warmup
  t_warmup: 50ba
  alpha_f: 0


optimizer:
  name: decoupled_adamw
  # lr: 7.7e-7
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  weight_decay: 0.0  # wd_article * lr

# Algorithms
algorithms:
  gradient_clipping:
    clipping_type: norm
    clipping_threshold: 1.0

# BENCHMARKS
# eval_gauntlet:
#   weighting: EQUAL
#   averages:
#     ru_en_average:
#     - ru
#     - en
icl_tasks:
  - label: mmlu
    dataset_uri: /home/jovyan/lora_llm_learner/metrics/mmlu
    # each num_fewshot is separate dataloader
    num_fewshot: [0, 5]
    icl_task_type: mmlu
    ####################
    # only for mmlu
    # be careful, because the settings
    # applied to all dataloaders in this tasks
    num_workers: 1
    pin_memory: true
    prefetch_factor: 2
    persistent_workers: false
    max_seq_len: 4096
    # it can have one, several, or none values.
    gauntlet_tags: ['en'] 
    ####################
  # - label: mmlu-pro
  #   dataset_uri: /home/jovyan/lora_llm_learner/metrics/mmlu-pro
  #   # each num_fewshot is separate dataloader
  #   num_fewshot: [0, 5]
  #   icl_task_type: mmlu
  #   choice_num2symbol:
  #      0: A
  #      1: B 
  #      2: C 
  #      3: D
  #      4: E
  #      5: F
  #      6: G
  #      7: H
  #      8: I
  #      9: J
    ####################
  - label: winogrande
    dataset_uri: /home/jovyan/lora_llm_learner/metrics/winogrande.jsonl # ADD YOUR OWN DATASET URI
    num_fewshot: [0]
    icl_task_type: schema
    max_seq_len: 2048
    gauntlet_tags: ['en']
use_profiler: false
profiler:
  trace_handlers:
    - name: json
      params:
      # composer.profiler.JSONTraceHandler kwargs
        folder: '/home/jovyan/temp/${exp_name}/composer_profiler'
        merged_trace_filename: null
        merged_trace_remote_file_name: null
        overwrite: true
        num_traces_to_keep: -1

  cyclic_schedule:
    # composer.profiler.cyclic_schedule kwargs
    #  Number of batches to skip profiling at epoch start
    skip_first: 5
    #  For each profiling cycle, number of batches to skip at the beginning of the cycle.
    wait: 0
    #  For each profiling cycle, number of batches to be in the warmup state after skipping
    #   ``wait`` batches
    warmup: 1
    #  For each profiling cycle, number of batches to record after warming up.
    active: 1
    #  Number of profiling cycles to perform per epoch
    repeat: 1

  profiler_overrides:
    # composer.profiler.Profiler kwargs
    # BASE
    torch_prof_folder:  '/home/jovyan/temp/${exp_name}/torch_profiler'
    torch_prof_overwrite: true
    torch_prof_num_traces_to_keep: -1
    sys_prof_stats_thread_interval_seconds: 0.5
    # METRICS
    # sys
    sys_prof_cpu: false
    sys_prof_memory: false
    sys_prof_disk: false
    sys_prof_net: false
    # torch
    torch_prof_record_shapes: false
    torch_prof_profile_memory: false
    torch_prof_with_stack: false
    torch_prof_memory_filename: null
    torch_prof_memory_remote_file_name: null


# max_duration: 5ep # In editable CFG
# eval_interval: 418ba
eval_first: true
eval_subset_num_batches: -1

# System
seed: ${global_seed}
precision: amp_bf16 #amp_fp16
dist_timeout: 36000

gigafsdp_config:
  tp_size: ${tp_size}
  load_monolith_rank0_only: false
  state_dict_type: local
  sync_module_states: false
  # --- optional gigafsdp params ---
  # hpz_first_layers_num: 40
  # hpz_group_size: 4
  # hybrid_group_size: 256
  

  activation_checkpointing: true
  activation_checkpointing_reentrant: false
  mixed_precision:
    param_dtype: bf16
    buffer_dtype: fp32
    reduce_dtype: fp32


# FSDP
# fsdp_config:
#   gigafsdp_enabled: true
#   load_monolith_rank0_only: false
#   state_dict_type: local
#   activation_checkpointing_reentrant: false

#   sync_module_states: true
