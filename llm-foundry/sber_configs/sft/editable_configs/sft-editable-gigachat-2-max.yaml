# Editable fields

# exp_name: Архитектура-размер-контекст-версия_sft-версия_chatml-gbs-dtype-tp_size-любой_комментарий
exp_name: GigaR-90b-131k-v28_2-v2-320gbs-bf16-tp2-default_name

max_seq_len: 131072       # ВАЖНО! Если у вас модель с rope_scaling нельзя менять этот параметр. Берите такой же, как в чекпоинте load_path
enable_async_tp: true     # оч сильно экономит память. Включать при tp_size>1
tp_size: 2                # зависит от чекпоинта в load_path 
sp_size:                  # можно выставить любой, но лучше чтобы tp*sp было в рамках одной ноды (8 карт)
  - sp_size: 4
    max_seq_len: ${max_seq_len}
# todo: dynamic sp sections
lr: 5.0e-7

# PT Checkpoint
load_path: /path/to/model_checkpoint    # путь до стартового чекпоинта fsdp

# BATCH SIZE
global_train_batch_size: 320      # должно делится на tp*sp
device_train_microbatch_size: 1   # global_train_batch_size = GPU / (tp*sp) * grad_accum * microbatch_size
device_eval_batch_size: 1

# TOKENIZER
tokenizer:
  name: /home/jovyan/models/gigar/gigachat4-pro-38b/gigachat4-pro-38b-8k_context-s3-ba126000/artifacts/tokenizer    # можно либо взять из sft-dataloader либо с претрейна
  
# DATALOADER
train_loader:
  dataset:
    # нельзя менять если у вас sft-dataloader с батчингом
    # ====================================================
    shuffle: false
    partition_algo: 'orig'
    num_canonical_nodes: 1
    # ====================================================
    streams:
      v27_2:
        local: /home/jovyan/isstolbov/preprocessed_data/v28_2_131k_fixed_batch320/         # путь до данных из sft-dataloader
        split: mds
data_proportion: 1.0                  # Scale size of complete dataset by itself, by default = 1.0

# NUMBER OF EPOCH 
max_duration: 1000ba                  # Сколько будет длится эпоха. ba - батчи \ ep - шаги. ep на этапе мерджа конфигов превретятся в ba. Рекомендуем использовать ba
save_interval: 500ba                  # Как часто сейвить модель
eval_interval: ${save_interval}       # Как часто считать mmlu и метрики SAM. Должно быть кратно save_interval
eval_first: true                      # Считать ли mmlu на первом шаге. Рекомендуем считать, так понятно не сломан ли стартовый чекпоинт

# OPTIMIZATION                     
# Косинусный оптимайзер   
scheduler:                    
  name: cosine_with_warmup    
  t_warmup: 100ba                   # Сколько батчей прогревать модель     
  alpha_f: 0.1                      # Во сколько раз уменьшить лр в конце обучения. Можно поставить например 0 \ 0.1 \ 0.01

# Константный с дропами
# scheduler:
#   milestones:                         # В каких точках дропать лр. Можно использовать ep, они превратятся в ba
#   - 1070ba
#   - 2140ba
#   - 3210ba
#   - 4280ba
#   - 5350ba
#   milestones_gamma:                   # Во сколько раз дропать лр относительно начального
#   - 0.1
#   - 0.01
#   - 0.001
#   - 0.0002
#   - 4.0e-05
#   name: constant_multi_step_with_gamma_with_warmup
#   t_warmup: 100ba                     # Сколько батчей прогревать модель

optimizer:
  lr: ${lr}
  weight_decay: 0.0                   # Очень важно, если хотите установить wd=0.1 то вам надо умножить lr на 0.1 и установить полученное значение.
                                      # Те если lr 5e-7, то с wd=1 надо ставить weight_decay: 5e-8

# FSDP
gigafsdp_config:                      # Не трогайте эти поля, если не понимаете что делаете :) 
  hybrid_group_size: 160
  # --- optional gigafsdp params ---
  # hpz_first_layers_num: 40
  # hpz_group_size: 4
  # hybrid_group_size: 24

# SAVE PATH
save_folder: /home/jovyan/shares/SR004.nfs2/gigachat_checkpoints/sft/${exp_name}            # это дефолтный путь для wm-train

# LOGGERS
loggers:
  tensorboard: 
    log_dir: '/home/jovyan/shares/SR004.nfs2/gigachat_checkpoints/sft/${exp_name}/tensorboard_sft'  # это дефолтный путь для wm-train
    rank_zero_only: true
  wandb:                          # ВАЖНО! Чтобы подключить wnb нужно настроить sber_configs/.wandb.env
    name: ${exp_name}
    project: max                     # имя проекта
    group: null
    entity: alignment             # название team для команбы алаймента
    tags: null
    log_artifacts: false
    rank_zero_only: true
    save_folder: ${save_folder}
    init_kwargs:
      notes: 
        global_train_batch_size: ${global_train_batch_size}
        max_seq_len: ${max_seq_len}
        lr: ${lr}
        max_duration: ${max_duration}
        load_path: ${load_path}

# AUTO METRICS
