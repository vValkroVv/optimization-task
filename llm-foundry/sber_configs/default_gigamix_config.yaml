# Validation NLL. Uncomment once a held-out split exists (it must NOT overlap with any
# `train_loader` stream, otherwise the numbers are contaminated and read optimistically).
# Logged to TensorBoard as `metrics/eval/LanguageCrossEntropy` (per-token NLL, nats) and
# `metrics/eval/LanguagePerplexity` = exp(NLL), on the same step axis as `loss/train/*`.
# `metric_names` is required here: without it every val metric is attached to this
# evaluator, and the ICL ones crash on a text batch (they need `continuation_indices`).
# Keep `shuffle: false` + `drop_last: false` so the same batches are scored every time.
# Eval runs without liger fusion, so logits are materialized in full
# (device_eval_batch_size x max_seq_len x vocab_size) -- keep `device_eval_batch_size`
# small and `eval_subset_num_batches` in the tens of batches.
# eval_loader:
#   eos_token_id: ${eos_token_id}
#   name: text
#   metric_names:
#     - LanguageCrossEntropy
#     - LanguagePerplexity
#   dataset:
#     local: /home/jovyan/datasets/GigaSets/tokenized/8k_context_128k_digits_tokenizer/3.6
#     split: <held-out split>
#     shuffle: false
#     max_seq_len: ${max_seq_len}
#   drop_last: false
#   num_workers: 2


eval_gauntlet:
  weighting: EQUAL
  # this allows you to average aggregations from gauntlet_tags
  averages:
    ru_en_average:
    - ru
    - en

