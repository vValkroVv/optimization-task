[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "job-submitter"
version = "0.1.1"
description = "Submit jobs to Slurm and Cloud regions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.36",
    "click>=8.1.8,<9",
    "jinja2>=3.0",
    "omegaconf>=2.3.0",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "requests>=2.28",
    "rich>=13.7.1,<14.0.0",
    "sqlite-s3-query==0.1.12",
    "typer>=0.12.5",
    "typing_extensions>=4.0",
]

[project.scripts]
js = "job_submitter.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.uv.sources]
sqlite-s3-query = { index = "gitlab" }

[[tool.uv.index]]
name = "mirror"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "gitlab"
url = "https://gitlab.ai.cloud.ru/api/v4/groups/gigallms/-/packages/pypi/simple"
explicit = true
authenticate = "always"

[tool.setuptools.packages.find]
where = ["."]
include = ["job_submitter*"]

[tool.setuptools.package-data]
"job_submitter.core.job_templates" = ["*.j2"]
"job_submitter.jobs.llmf" = ["metric_sampler_configs/*.yaml"]
