---
run_name: run_name
exp_name: exp_name
user: user

tensorboard_path: /home/jovyan/${user}/tensorboard_test/${exp_name}

max_seq_len: 4096

autometrics:
  globals:
    delete_converted_hf: false
    full_metrics_recalculate: false

  router:
    host: 0.0.0.0

  convertation:
    mappers:
      - map_gigafsdp_to_hf_safetensor
    input_tp_size: 1

  preparation:
    skip: true

  quantization:
    skip: false
    device_map: auto
    quantization_config:
      weight_block_size: [128, 128]
      modules_to_not_convert: [
        "lm_head",
        "embed_tokens",
        "shared_head.head",
        "mlp.gate.weight",
        "eh_proj",
        "self_attn.A_log",
        "self_attn.conv1d",
        "self_attn.dt_bias",
        "self_attn.in_proj_ba",
        "self_attn.norm.weight",
        "self_attn.gate_proj",
        "gate_up_projection",
        "gate_down_projection",
        "shared_expert_sigmoid",
        "indexer.wk",
        "indexer.weights_proj",
        "mlp.gate_proj",
        "mlp.up_proj",
        "mlp.down_proj",
        "mlp.shared_experts",
      ]

  inference:
    shared_params:
      allow-auto-truncate: true
      enable-dp-attention: true
      enable-dp-attention-local-control-broadcast: true
      kv-cache-dtype: fp8_e4m3
      disable-prefill-cuda-graph: true
    prefill_fraction: 0.75
    prefill:
      tp: 8
      ep: 8
      dp: 8
      pp: 4
      chunked-prefill-size: 65536
    decode:
      tp: 32
      ep: 32
      dp: 32
      chunked-prefill-size: 8192
      auto-mtp: true
      disaggregation-decode-extra-slots: 4
      enable-gdn-spec-replay-commit: true

  model_info:
    model_class: "sft"
    size: "ultra"
    username: ${user}

  obm_proxy:
    # sampling-params:
    #   temperature: 0.7
    chat-template-kwargs:
      reasoning: true
    reasoning-token-budget: 32768
    # Need for instruct metrics.
    chat-template: <path to jinja template>

  evaluators:
    safety_unified:
      judges:
        Qwen3-235B-A22B-Instruct-2507-FP8: all
        Qwen3.5-397B-A17B-FP8: all
      selection_manifest: big_pipeline.json
      domain_rules_file: domain_rules.json

    tau3:
      num-trials: 3
      domains:
        - airline
        - retail
        - telecom
        - banking_knowledge
      user_model_name: Qwen3-235B-A22B-Instruct-2507-FP8

    # GigaMetric (opt-in). Полный пример: configs/gigametric/gigachat_700b.yaml.
    new_obm:
      obm_config: devices-v2

      all:
        groups:
          - assistant
          - b2c
          - code
          - functions
          - long
          - math
          - open
          - reward
          - sber
          - ssu
          # Optional task-name filter.
          # tasks:
          #   - mmlu
          #   - gsm8k
          # Task names to exclude from the run.
          # ignore_tasks:
          #   - mmlu
          # Clear OBM cache before running.
          # restart: false
          # Per-dataset context overrides.
          # context: <path to context yaml>
          # Disable few-shot examples for all tasks.
          # disable_few_shots: false
          # Disable suggested generation params for all tasks.
          # disable_suggested_params: false


    new_obm_judged:
      obm_config: devices
      all:
        tasks:
          - pollux
      judges:
        pollux-judge-32b:
          - pollux

    lm_eval:
      instruct:
        lcb_code_gen_lite_instruct:
          none

      pretrain:
        # Knowledge / reasoning
        mmlu_pro:
          num_fewshot: 5

        mmlu:
          num_fewshot: 5

        mmlu_cloze:
          num_fewshot: 5

        mmlu_redux_generative:
          num_fewshot: 5

        bbh:
          num_fewshot: 3

        supergpqa:
          num_fewshot: 5

        supergpqa_cot:
          num_fewshot: 5

        supergpqa_cot_official:
          num_fewshot: 0

        gpqa_diamond_zeroshot:
          num_fewshot: 0

        triviaqa:
          num_fewshot: 5

        agieval:
          num_fewshot: 0

        agieval_deepseek_card:
          num_fewshot: 0

        nq_open:
          num_fewshot: 5

        hellaswag:
          num_fewshot: 10

        winogrande:
          num_fewshot: 5

        arc_easy:
          num_fewshot: 25

        arc_challenge:
          num_fewshot: 25

        gpqa_diamond_n_shot:
          num_fewshot: 5

        gpqa_diamond_cot_official:
          num_fewshot: 0

        drop:
          num_fewshot: 5

        # Math
        gsm8k:
          num_fewshot: 8

        minerva_math:
          num_fewshot: 4

        # Code
        humaneval:
          num_fewshot: 0
          log_samples: true

        mbpp:
          num_fewshot: 3

        humaneval_plus:
          num_fewshot: 0

        mbpp_plus:
          num_fewshot: 3

        evalplus_official:
          num_fewshot: 0

        lcb_code_gen_lite:
          num_fewshot: 0

        cruxeval:
          num_fewshot: 0

        # MultiPL-E

        # Multilingual
        mmmlu_zh_cn:
          num_fewshot: 5

        mgsm_en_cot_en:
          num_fewshot: 8

        mgsm_en_cot_ru:
          num_fewshot: 8

        mgsm_en_cot_zh:
          num_fewshot: 8

        # LongContext
        # longbench2:
        #   num_fewshot: 0

        # ruler:
        #   num_fewshot: 0
        #   metadata: '{"max_seq_lengths":[4096,8192,16384]}'

        # mrcr:
        #   num_fewshot: 0

        # Ru
        bouquet:
          num_fewshot: 5

        babymmlu2:
          num_fewshot: 5

        spellcheck_punctuation_ru:
          num_fewshot: 5

        slava:
          num_fewshot: 5

        russian_gec:
          num_fewshot: 0

        rublimp:
          num_fewshot: 0

        ruscontext:
          num_fewshot: 5

    mera:
      # System prompt applied to all MERA tasks. Keep "none" to use the default
      # prompt, or replace it with a custom string. Individual tasks can
      # override it by setting their own system_instruction
      # (see simplear below).
      system_instruction: none

      simplear:
        # system_instruction: "Custom prompt for this task only"
        none

      bps_gen:
        none

      lcs_gen:
        none

      chegeka:
        none

      mathlogicqa_gen:
        none

      parus_gen:
        none

      rcb_gen:
        none

      rudetox:
        none

      ruhatespeech_gen:
        none

      rummlu_gen:
        none

      ruworldtree_gen:
        none

      ruopenbookqa_gen:
        none

      rumultiar:
        none

      use:
        none

      rwsd_gen:
        none

      mamuramu_gen:
        none

      multiq:
        none

      rumodar:
        none

      ruhhh_gen:
        none

      ruethics_gen:
        none

      rucodeeval:
        none

      ruhumaneval:
        none

      # MERA Industrial
      agro_bench:
        none

      aqua_bench:
        none

      med_bench:
        none

      # MERA Code (без Docker)
      codecorrectness:
        none

      codelintereval:
        none

      rucodereviewer:
        none

      strucom:
        none

    dredd:
      judge:
        model_name: "minimax-m2.7"

    bfcl:
      model: gigachat-FC
      test_category: all

    tau2:
      domains:
        - airline
        - retail
        - telecom
      user_model_name: Qwen3-235B-A22B-Instruct-2507-FP8

    skillsbench:
      agent: openhands-cli
      pass-at-k: 1
      max-tokens: 16384
      max-input-tokens: 98304
      n-concurrent: 32

    nl2repo:
      agent: openhands-sdk
      pass-at-k: 1
      max-tokens: 16384
      max-input-tokens: 98304
      n-concurrent: 32

    terminal_bench:
      agent: mini-swe-agent
      max-tokens: 16384
      max-input-tokens: 98304
      n-concurrent: 89

    harbor_rli:
      runs:
        - benchmark: harness-bench-lite
          pass-at-k: 8
          agent-timeout: 28800
          benchmark-kwargs:
            forward-reasoning-history: true
            recursion-limit: 80
        - benchmark: harness-bench-medium
          pass-at-k: 8
          agent-timeout: 28800
          benchmark-kwargs:
            forward-reasoning-history: true
            recursion-limit: 80
        - benchmark: terminal-bench-2.1
          agent: mini-swe-agent
          max-tokens: 16384
          n-concurrent: 89
          pass-at-k: 1
        - benchmark: cowork-bench
          agent: strands
          max-tokens: 32768
          n-concurrent: 64
          pass-at-k: 1
        - benchmark: swe-bench-multilingual
          agent: mini-swe-agent
          max-tokens: 16384
          n-concurrent: 64
          pass-at-k: 1

    pier_rli:
      benchmark: deepswe
      command-timeout: 30
      agent: mini-swe-agent
      max-tokens: 16384
      n-concurrent: 64

    swe_bench:
      agent: mini-swe-agent
      max-tokens: 16384
      max-input-tokens: 98304
      n-concurrent: 64

    forge:
      judge: Qwen3-235B-A22B-Instruct-2507-FP8

    # checkpoint_stats: статистика весов HF-чекпоинта, см. README, блок 20.
    checkpoint_stats: {}
