---
run_name: 90b-vision-eval
exp_name: 90b-vision-eval
user: user

tensorboard_path: /workspace-SR004.nfs2/${user}/tensorboard_test/${exp_name}

max_seq_len: 4096  # не используется lmms_eval, обязателен для PAM

autometrics:
  globals:
    delete_converted_hf: false
    full_metrics_recalculate: false
  router:
    host: 0.0.0.0
    policy: cache_aware
    cache-threshold: 0.50
    balance-abs-threshold: 4
    balance-rel-threshold: 1.10
  obm_proxy:  # used for obm evaluation
    # sampling-params:
    #   temperature: 0.7
    workers: 100
    template-version: v4.1
    chat-template: ""  # find somewhere is sft-data-tokenizer; needed for OBM
  convertation:
    mappers:
      - map_mixed_gigafsdp_to_fsdp  # only works with these mappers!!!
      - map_fsdp_to_hf
    input_tp_size: 1
    prepare_ema_weight: false
    skip_optimizer: true
    use_ema: false
    skip_ema_mapper: true
  preparation:
    skip: true
  inference:
    allow-auto-truncate: true
    tp: 8
    disable-fast-image-processor: true
    attention-backend: triton
  model_info:
    model_class: "vision"  # IMPORTANT TO SET
    size: "max"  # lite / pro / max / ultra
    username: ${user}
  evaluators:
    lmms_eval:
      chatml_version: v4.1
      runs:
        # chartqa_smoke:
        #   benchmarks:
        #     tasks:
        #       - chartqa_giga
        #     limit: 10
        all:
          benchmarks:
            categories:
              - all
    new_obm:
      obm_config: devices
      all:
        groups: [b2c, math, open, functions]
