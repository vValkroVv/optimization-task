---
run_name: run_name
exp_name: exp_name
user: user

tensorboard_path: /home/jovyan/${user}/tensorboard_test/${exp_name}

max_seq_len: 4096

autometrics:
  globals:
    delete_converted_hf: false
    full_metrics_recalculate: false

  router:
    host: 0.0.0.0

  convertation:
    mappers:
      - map_gigafsdp_to_hf_safetensor
    input_tp_size: 1

  preparation:
    skip: true

  inference:
    allow-auto-truncate: true
    tp: 1
    dp: 8
    reasoning-parser: qwen3
    tool-call-parser: qwen

  model_info:
    model_class: "sft"
    size: "ultra"
    username: ${user}

  obm_proxy:
    # sampling-params:
    #   temperature: 0.7
    chat-template-kwargs:
      enable_thinking: true
    reasoning-token-budget: 32768

  evaluators:
    planbench:
      engine: planbench_chat
      task: t1
      domains:
        - blocksworld
