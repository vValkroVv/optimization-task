---
run_name: run_name
exp_name: exp_name
user: user

tensorboard_path: /home/jovyan/${user}/tensorboard_test/${exp_name}

max_seq_len: 4096

autometrics:
  globals:
    delete_converted_hf: false
    full_metrics_recalculate: false

  router:
    host: 0.0.0.0

  convertation:
    mappers:
      - map_gigafsdp_to_hf_safetensor
    input_tp_size: 1

  preparation:
    skip: true

  quantization:
    skip: false
    device_map: auto
    quantization_config:
      weight_block_size: [128, 128]
      modules_to_not_convert: [
        "lm_head",
        "embed_tokens",
        "shared_head.head",
        "mlp.gate.weight",
        "eh_proj",
        "self_attn.A_log",
        "self_attn.conv1d",
        "self_attn.dt_bias",
        "self_attn.in_proj_ba",
        "self_attn.norm.weight",
        "self_attn.gate_proj",
        "gate_up_projection",
        "gate_down_projection",
        "shared_expert_sigmoid",
        "indexer.wk",
        "indexer.weights_proj",
        "mlp.gate_proj",
        "mlp.up_proj",
        "mlp.down_proj",
        "mlp.shared_experts",
      ]

  inference:
    shared_params:
      allow-auto-truncate: true
      enable-dp-attention: true
      disable-prefill-cuda-graph: true
    prefill_fraction: 0.5
    prefill:
      tp: 2
      ep: 2
      dp: 2
      pp: 4
      mem-fraction-static: 0.70
      max-running-requests: 256
      max-mamba-cache-size: 1280
      chunked-prefill-size: 32768
    decode:
      tp: 8
      ep: 8
      dp: 8
      mem-fraction-static: 0.80
      max-running-requests: 1536
      max-mamba-cache-size: 3072
      auto-mtp: true
      disaggregation-decode-extra-slots: 4
      enable-gdn-spec-replay-commit: true

  model_info:
    model_class: "sft"
    size: "max"
    username: ${user}

  obm_proxy:
    chat-template-kwargs:
      reasoning: true
    reasoning-token-budget: 32768
    chat-template: <path to jinja template>

  evaluators:
    lm_eval:
      pretrain:
        mmlu_pro_32:
          num_fewshot: 5

        mmlu:
          num_fewshot: 5

        mmlu_cloze:
          num_fewshot: 5

        mmlu_redux_generative:
          num_fewshot: 5

        bbh_cot_fewshot_32:
          num_fewshot: 3

        supergpqa:
          num_fewshot: 5

        supergpqa_cot:
          num_fewshot: 5

        supergpqa_cot_official:
          num_fewshot: 0

        gpqa_diamond_zeroshot:
          num_fewshot: 0

        gpqa_diamond_n_shot:
          num_fewshot: 5

        gpqa_diamond_cot_official:
          num_fewshot: 0

        gpqa_main_generative_n_shot_32:
          num_fewshot: 5

        gpqa_diamond_generative_n_shot_32:
          num_fewshot: 5

        triviaqa_32:
          num_fewshot: 5

        agieval:
          num_fewshot: 0

        agieval_deepseek_card:
          num_fewshot: 0

        nq_open_32:
          num_fewshot: 5

        hellaswag:
          num_fewshot: 10

        winogrande:
          num_fewshot: 5

        arc_easy:
          num_fewshot: 25

        arc_challenge:
          num_fewshot: 25

        drop_32:
          num_fewshot: 5

        gsm8k_32:
          num_fewshot: 8

        minerva_math_32:
          num_fewshot: 4

        minerva_math500_32:
          num_fewshot: 4

        minerva_math_ru_32:
          num_fewshot: 4

        humaneval_64:
          num_fewshot: 0

        mbpp_32:
          num_fewshot: 3

        humaneval_plus_64:
          num_fewshot: 0

        mbpp_plus_32:
          num_fewshot: 3

        evalplus_official:
          num_fewshot: 0

        lcb_code_gen_lite_32:
          num_fewshot: 0

        cruxeval_32:
          num_fewshot: 0

        mmmlu_zh_cn:
          num_fewshot: 5

        mgsm_en_cot_en_32:
          num_fewshot: 8

        mgsm_en_cot_ru_32:
          num_fewshot: 8

        mgsm_en_cot_zh_32:
          num_fewshot: 8

        bouquet:
          num_fewshot: 5

        babymmlu2:
          num_fewshot: 5

        spellcheck_punctuation_ru_32:
          num_fewshot: 5

        slava_32:
          num_fewshot: 5

        russian_gec:
          num_fewshot: 0

        rublimp:
          num_fewshot: 0

