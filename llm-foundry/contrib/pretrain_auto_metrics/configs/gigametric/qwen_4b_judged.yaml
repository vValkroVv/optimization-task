run_name: gigametric_judged_qwen_4b
exp_name: gigametric_judged_qwen_4b
user: user

tensorboard_path: /home/jovyan/${user}/tensorboard_test/${exp_name}
max_seq_len: 8192

autometrics:
    # obm_proxy:
    #     sampling-params:
    #         temperature: 0.7
    globals:
        delete_converted_hf: false
        full_metrics_recalculate: false

    router:
        host: 0.0.0.0

    convertation:
        mappers:
            - map_gigafsdp_to_hf_safetensor
        input_tp_size: 1

    preparation:
        skip: true

    inference:
        allow-auto-truncate: true
        tp: 1
        dp: 8
        # non-thinking Qwen3-*-Instruct-2507: reasoning-parser НЕ ставить (ответ
        # уедет в reasoning_content -> бенчи дадут 0).
        tool_call_parser: qwen

    model_info:
        model_class: "sft"
        size: "lite"
        username: ${user}

    evaluators:
        gigametric_judged:
            base_dir: /home/jovyan/${user}/gigametric_runs
            local_model_id: qwen_4b_local

            max_concurrent_requests: 4
            benchmarks:
                bbh:
                    num_items: 8
                hle:
                    num_items: 8
                ragqa:
                    num_items: 8
                tau2:
                    num_items: 8
                    num_trials: 1
                thinkbench:
                    num_items: 8
                finance_qa:
                    num_items: 8
                finam_finbench:
                    num_items: 8

            judges:
                Qwen3.5-397B-A17B-FP8:
                    - bbh
                    - hle
                    - ragqa
                    - tau2
                    - thinkbench
                    - finance_qa
                    - finam_finbench
