---
run_name: <run_name>
exp_name: <exp_name>
user: <user>

tensorboard_path: /home/jovyan/${user}/tensorboard_test/${exp_name}

max_seq_len: 65536

autometrics:
  globals:
    delete_converted_hf: false
    full_metrics_recalculate: false

  router:
    host: 0.0.0.0

  convertation:
    mappers:
      - map_gigafsdp_to_hf_safetensor
    input_tp_size: 1

  preparation:
    skip: true

  inference:
    allow-auto-truncate: true
    tp: 32
    ep: 32
    max-running-requests: 128
    mem-fraction-static: 0.75
    context-length: 65536


  model_info:
    model_class: "sft"
    size: "lite"
    username: ${user}

  obm_proxy:
    # sampling-params:
    #   temperature: 0.7
