        - benchmark: harness-bench-lite
          pass-at-k: 8
          agent_timeout: 3600
          benchmark-kwargs:
            forward-reasoning-history: true
            recursion-limit: 80
        - benchmark: harness-bench-medium
          pass-at-k: 8
          agent_timeout: 3600
          benchmark-kwargs:
            forward-reasoning-history: true
            recursion-limit: 80
        - benchmark: terminal-bench-2.1
          agent: mini-swe-agent
          max-tokens: 16384
          n-concurrent: 89
          pass-at-k: 1
        - benchmark: cowork-bench
          agent: strands
          max-tokens: 32768
          n-concurrent: 64
          pass-at-k: 1
        - benchmark: swe-bench-multilingual
