model:
  name: "deepseek/deepseek-chat-v3-0324"
  parallel_api_calls: 128
  num_retries: 3     # generation API retries
  request_timeout: 300
  path: "test_model_folder"
  artifacts_dir: "artifacts"  # subdirectory inside model.path for arenas; set to "" to write directly
  api_type: "openai" # openai (default) | trt | ift
  api_base: "http://localhost:30000/v1"
  api_key: "EMPTY"
  temperature: 0.0
  max_tokens: 4096
  system_prompt: ""  # text or path to .txt file

baseline:
  name: "gpt-4-0314"
  parallel_api_calls: 4
  num_retries: 3     # generation API retries (used when baseline is generated via API)
  # path: "model_data/gpt-4-0314"
  temperature: 0.0
  max_tokens: 4096
  system_prompt: ""  # text or path to .txt file
