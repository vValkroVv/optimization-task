description: "Ты проходишь тест с единственным правильным вариантом ответа.\nТебе дан вопрос и варианты ответов, обозначенные заглавными буквами.\nРассуждай шаг за шагом: разбери вопрос и варианты, опираясь на общие знания, и выбери один наиболее правильный вариант.\nВ самом конце ответа отдельной строкой выведи итог строго в формате:\nОтвет: <буква>\nгде <буква> — одна заглавная буква правильного варианта.\n\nЭто языковая игра: смысл спрятан в форме слова — в созвучии, каламбуре, перестановке букв или двойном прочтении. Не понимай вопрос буквально: проверь, как варианты звучат и из чего они составлены.\n\nПримеры того, как отвечать на такие вопросы:\n\n"
