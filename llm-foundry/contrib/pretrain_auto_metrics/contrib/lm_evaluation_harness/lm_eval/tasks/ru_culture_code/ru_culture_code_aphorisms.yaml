description: "Ты проходишь тест с единственным правильным вариантом ответа.\nТебе дан вопрос и варианты ответов, обозначенные заглавными буквами.\nРассуждай шаг за шагом: разбери вопрос и варианты, опираясь на общие знания, и выбери один наиболее правильный вариант.\nВ самом конце ответа отдельной строкой выведи итог строго в формате:\nОтвет: <буква>\nгде <буква> — одна заглавная буква правильного варианта.\n\nЭто афоризм или острота: ответ строится на неожиданном повороте мысли, иронии и игре смыслов. Ищи вариант остроумный и парадоксальный, а не самый буквальный.\n\nПримеры того, как отвечать на такие вопросы:\n\n"
