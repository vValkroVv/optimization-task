custom_dataset: !function utils.build_dataset_from_napi
output_type: generate_until
test_split: test
unsafe_code: false

doc_to_target: !function utils.doc_to_target_noop

repeats: 1

generation_kwargs:
  do_sample: false
  max_gen_toks: 4096
  until: []

filter_list:
  - name: "passthrough"
    filter:
      - function: "custom"
        filter_fn: !function utils.passthrough_filter

metric_list:
  - metric: codeelo_avg_rating
    aggregation: !function utils.aggregate_avg_rating
    higher_is_better: true
  - metric: codeelo_pass_at_1
    aggregation: !function utils.aggregate_pass_at_1
    higher_is_better: true
  - metric: codeelo_pass_at_2
    aggregation: !function utils.aggregate_pass_at_2
    higher_is_better: true
  - metric: codeelo_pass_at_4
    aggregation: !function utils.aggregate_pass_at_4
    higher_is_better: true
  - metric: codeelo_pass_at_8
    aggregation: !function utils.aggregate_pass_at_8
    higher_is_better: true

num_fewshot: 0

metadata:
  version: 0.2
