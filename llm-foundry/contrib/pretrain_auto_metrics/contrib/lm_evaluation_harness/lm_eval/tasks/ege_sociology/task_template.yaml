test_split: test
fewshot_split: validation
fewshot_config:
  sampler: first_n
dataset_path: nastyafairypro/ege_sociology
dataset_name: null
output_type: generate_until
doc_to_text: "{{context}}\nНапиши ответ одной строкой — только цифры (примеры: 1; 45; 123; 254). Без букв, пробелов и пояснений.\nОтвет: "
doc_to_target: "{{continuation}}"
target_delimiter: ""
num_fewshot: 5
generation_kwargs:
  until:
    - "\n"
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
    regexes_to_ignore:
      - ","
      - " "
metadata:
  version: 1.0
