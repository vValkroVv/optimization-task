task: doom_math
dataset_path: ai-sage/doom_math
test_split: test

doc_to_text: !function utils.doc_to_text_math
doc_to_target: !function utils.doc_to_target
process_results: !function utils.process_results

output_type: generate_until
generation_kwargs:
  max_gen_toks: 4096
  temperature: 0.0
  until:
    - "task:"
    - "</s>"
    - "<|im_end|>"
    - "<|endoftext|>"
    - "Ты — точный помощник"

metric_list:
  - metric: doom_score
    aggregation: mean
    higher_is_better: true
  - metric: math_verify
    aggregation: mean
    higher_is_better: true


metadata:
  version: 1.0
