  - problem: |
      The numbers 1, 2, ..., 2100 are written on a board. Every second, Mark takes two numbers on the board, \( a \) and \( b \), erases them, and replaces them with \( \gcd(a, b) \) and \( \operatorname{lcm}(a, b) \). Mark stops once any move he makes will not change the numbers written on the board. Compute the number of divisors of the 2026th smallest positive integer written on the board when he finishes.
    answer: |
      The operation preserves the multiset of prime‑exponents for each prime.
      When the process stops the numbers form a chain under divisibility, so for each prime \(p\) the exponents in the final list are just the original exponents sorted.

      For a prime \(p\) the \(r\)-th largest exponent among \(1,\dots ,N\) is the largest \(t\) with
      \(\big\lfloor \frac{N}{p^{t}}\big\rfloor\ge r\).
      Hence the \(r\)-th largest number on the board is

      \[
      \operatorname{lcm}\bigl(1,2,\dots ,\big\lfloor \tfrac{N}{r}\big\rfloor\bigr).
      \]

      Here \(N=2100\). The 2026‑th smallest corresponds to \(r=N-2026+1=75\):
      \[
      \big\lfloor \tfrac{2100}{75}\big\rfloor = 28,
      \]
      so the required integer is \(\operatorname{lcm}(1,2,\dots ,28)\).

      Factorising,
      \[
      \operatorname{lcm}(1,\dots ,28)=2^{4}\cdot 3^{3}\cdot 5^{2}\cdot 7\cdot 11\cdot 13\cdot 17\cdot 19\cdot 23 .
      \]

      The number of its divisors is
      \[
      (4+1)(3+1)(2+1)(1+1)^{6}=5\cdot4\cdot3\cdot2^{6}=5\cdot4\cdot3\cdot64=3840.
      \]

      \[
      \boxed{3840}
      \]
  - problem: |
      Sarunyu has a stick of length 1 with one endpoint marked in red. Every minute, he picks one of his sticks uniformly at random and breaks it into two halves of equal length. Compute the expected length of the stick with the red endpoint after 5 minutes.
    answer: |
      Let \(L_n\) be the length of the stick containing the red endpoint after \(n\) minutes.
      At minute \(i\) there are \(i\) sticks, so the red stick is chosen with probability \(\frac1i\).
      If it is chosen its length halves; otherwise it stays the same.

      Thus
      \[
      L_{i}=L_{i-1}\cdot\begin{cases}
      \frac12 & \text{with prob. }\frac1i,\\[4pt]
      1 & \text{with prob. }1-\frac1i .
      \end{cases}
      \]

      Because the choice at minute \(i\) is independent of the past,
      \[
      \mathbb{E}[L_i]=\mathbb{E}[L_{i-1}]\Bigl(\Bigl(1-\frac1i\Bigr)\cdot1+\frac1i\cdot\frac12\Bigr)
      =\mathbb{E}[L_{i-1}]\Bigl(1-\frac1{2i}\Bigr).
      \]

      With \(L_0=1\),
      \[
      \mathbb{E}[L_n]=\prod_{i=1}^{n}\Bigl(1-\frac1{2i}\Bigr)
      =\prod_{i=1}^{n}\frac{2i-1}{2i}
      =\frac{(2n)!}{4^{\,n}(n!)^{2}}
      =\frac{\binom{2n}{n}}{4^{\,n}}.
      \]

      For \(n=5\):
      \[
      \mathbb{E}[L_5]=\frac{\binom{10}{5}}{4^{5}}
      =\frac{252}{1024}
      =\frac{63}{256}.
      \]

      \[
      \boxed{\dfrac{63}{256}}
      \]
  - problem: |
      A regular hexagon with side length 4 is subdivided into a lattice of 96 equilateral triangles of side length 1. Let $S$ be the set of all vertices of this lattice. Compute the number of nondegenerate triangles with vertices in $S$ that contain the center of the hexagon strictly in their interior.
    answer: |
      The lattice \(S\setminus\{O\}\) consists of \(60\) points lying on \(36\) rays through the center \(O\).
      The rays occur in the repeating angular pattern

      \[
      A\;(n=4),\;D\;(n=1),\;C\;(n=1),\;B\;(n=2),\;C\;(n=1),\;D\;(n=1)
      \]

      (where \(n\) denotes the number of lattice points on that ray).
      A triangle with vertices on three distinct rays contains \(O\) strictly in its interior iff the three rays are not contained in any closed half‑plane, i.e. the largest angular gap between them is at most \(17\) steps (since \(18\) steps \(=180^\circ\)).

      For a fixed ray \(i\) let \(Q_i\) be the sum of \(n_jn_k\) over all pairs of other rays \(\{j,k\}\) such that \(\{i,j,k\}\) is “good’’ (max gap \(\le 17\)).
      By symmetry \(Q_i\) depends only on the type of ray:

      \[
      \begin{array}{c|c}
      \text{type} & Q\\\hline
      A\;(n=4) & 310\\
      B\;(n=2) & 358\\
      C\;(n=1) & 385\\
      D\;(n=1) & 385
      \end{array}
      \]

      The total weighted sum over all good triples of rays is

      \[
      \begin{aligned}
      e_3^{\text{good}}
      &=\frac13\Bigl(6\cdot4\cdot310+6\cdot2\cdot358+12\cdot1\cdot385+12\cdot1\cdot385\Bigr)\\
      &=8\cdot310+4\cdot358+4\cdot385+4\cdot385\\
      &=2480+1432+1540+1540\\
      &=6992 .
      \end{aligned}
      \]

      Each term \(n_i n_j n_k\) counts the triangles obtained by choosing one lattice point on each of the three rays. Hence the number of non‑degenerate triangles with vertices in \(S\) that contain the center strictly in their interior is

      \[
      \boxed{6992}.
      \]