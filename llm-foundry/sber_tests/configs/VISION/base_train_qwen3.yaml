run_name: test-omni-vision-small-model
exp_name: ${run_name}

tensorboard_path:
save_folder:
save_logits_folder: ${save_folder}/logits.pt

global_seed: 11
max_seq_len: 8192
precision: amp_bf16

sft_mode: true
omni_mode: true
varlen_input: false
zero_nan_grads: false

image_token_id: 128005
eos_token_id: 2

tokenizer:
  kwargs:
    legacy: false
    model_max_length: ${max_seq_len}
    use_fast: true
  name: /home/jovyan/test_cache/tokenizers/chatml_tokenizer_9b_chat_template


vision_processor: &vision_processor
  name: GigaOmniVisionProcessor
  image_aspect_ratio: qwen
  num_image_tokens_per_crop: 1
  image_token_id: ${image_token_id}
  image_processor: /home/jovyan/test_cache/models/vision/Qwen3-VL-8B-Instruct-VE


image_collator: &image_collator
  name: QwenImageCollator


train_loader:
  name: omni
  eos_token_id: ${eos_token_id}
  sft_mode: ${sft_mode}
  drop_last: true
  num_workers: 1

  dataset:
    allow_short_inputs: true
    processors:
      - <<: *vision_processor

    collators:
      - <<: *image_collator

    epoch_size: 10_000
    shuffle: false
    shuffle_seed: ${global_seed}
    max_seq_len: ${max_seq_len}

    streams:
      default:
        local: /home/jovyan/test_cache/datasets/vision/sft_v0.4.2_no_image_in_message/mds
        proportion: 1.0
        split: mds
        files_folder_path: /home/jovyan/test_cache/datasets/vision/sft_v0.4.2_no_image_in_message/images
      sft_one_image_in_message_light:
        local: /home/jovyan/test_cache/datasets/vision/sft_v0.4.2_one_image_in_message/mds
        proportion: 1.0
        split: mds
        files_folder_path: /home/jovyan/test_cache/datasets/vision/sft_v0.4.2_one_image_in_message/images
      sft_several_images_in_dialog_light:
        local: /home/jovyan/test_cache/datasets/vision/sft_v0.4.2_several_images_in_message/mds
        proportion: 1.0
        split: mds
        files_folder_path: /home/jovyan/test_cache/datasets/vision/sft_v0.4.2_several_images_in_message/images_1_crop
      sft_several_images_in_message_light:
        local: /home/jovyan/test_cache/datasets/vision/sft_v0.4.2_several_images_in_dialog/mds
        proportion: 1.0
        split: mds
        files_folder_path: /home/jovyan/test_cache/datasets/vision/sft_v0.4.2_several_images_in_dialog/images_1_crop

global_train_batch_size: 8
device_train_microbatch_size: 1
device_eval_batch_size: 1

init_device: cpu

max_duration: 200ba
save_interval: 100ba
eval_interval: 0
eval_before_train: skip
eval_subset_num_batches: -1

DEBUG_MOE_GATE: true

algorithms:
  gradient_clipping:
    clipping_type: norm
    clipping_threshold: 1.0

seed: ${global_seed}
dist_timeout: 1800

progress_bar: false
log_to_console: true
console_log_interval: 50ba

callbacks:
  speed_monitor:
    window_size: 10
  stage_time_profiler: {}
  lr_monitor: {}
  memory_monitor: {}
  runtime_estimator: {}
  optimizer_monitor:
    batch_log_interval: 100
  scheduled_gc:
    batch_interval: 100
  training_metrics_monitor:
    batch_log_interval: 500

auto_log_hparams: false

loggers:
  tensorboard:
    log_dir: ${tensorboard_path}
    rank_zero_only: true

load_strict_model_weights: false
load_weights_only: true
