model:
  name: gigaomni_causal_lm
  init_device: ${init_device}

  language_model:
    name: giga_mix_causal_lm
    init_device: ${init_device}
    pretrained: false
    pretrained_model_name_or_path: null

    use_cache: false
    vocab_size: 128256
    tp_size: ${tp_size}
    max_position_embeddings: ${max_seq_len}

    seed: ${global_seed}
    hidden_size: 64
    num_hidden_layers: 2
    num_attention_heads: 8
    num_key_value_heads: 8
    attention_hidden_size: null

    intermediate_size: 64
    dense_intermediate_size: 64

    # MOE
    moe_impl: DeepseekGMMMoeBlock
    first_k_dense_replace: 1
    n_shared_experts: 1

    scoring_func: sigmoid
    router_aux_loss_coef: 0.0001
    router_legacy_weight_init: false
    router_seq_aux: true
    moe_router_bias_update_rate: 0.001
    aux_loss_free: true
    drop_by_group_capacity: true

    # MLA
    attention_type: LlamaLatentAttention
    qk_nope_head_dim: 8
    qk_rope_head_dim: 8
    v_head_dim: 16
    kv_lora_rank: 32
    q_lora_rank: 0
    num_krope_heads: 1
    rope_theta: 100000
    apply_torch_compile_to_projections: false
    use_custom_rotary_kernel: false

    rms_norm_eps: 1.0e-04

    initializer_range: 0.006
    init_type: deepseek # normal_ init with std=0.006

    use_liger: false
    delete_logits: false
    loss_inplace_backward: false
    fused_mlp: false
    activation_checkpoint_layers_num: null

    deterministic_attention: true

  encoders:
    - name: InternViTForVisualLanguageModeling
      pretrained_model_name_or_path: /home/jovyan/test_cache/models/vision/InternViT-300M-448px-V2_5-no-drop-path-no-fa
      init_device: ${init_device}

  adapters:
    - name: VisionPixelShuffleAdapter
      init_device: ${init_device}
      llm_hidden_size: ${model.language_model.hidden_size}
      ve_hidden_size: 1024
      downsample_ratio: 0.5

  modalities:
    - name: VisionModality
      data_flow_preset: vision_intern_vit
      modality_output:
        type: adapter_outputs
        name: pixel_shuffle_mlp.image
        key: pixel_embeds
        placeholder_token_id: ${image_token_id}
