model:
  name: gigaomni_causal_lm
  init_device: ${init_device}
  language_model:
    name: gigar_causal_lm
    init_device: ${init_device}
    pretrained: false
    pretrained_model_name_or_path: null

    seed: ${global_seed}
    num_hidden_layers: 2
    hidden_size: 64
    intermediate_size: 64
    num_attention_heads: 8
    num_key_value_heads: 8
    max_position_embeddings: ${max_seq_len}
    tp_size: ${tp_size}
    fused_mlp: false
    fused_mlp_checkpoint_lvl: 0
    activation_checkpoint_layers_num: null
    loss_inplace_backward: false
    attention_hidden_size: null
    attention_type: LlamaPackedAttention
    parallel_embedding_type: VocabParallelEmbedding
    deterministic_attention: true
    vocab_size: 128256

  encoders:
    - name: Qwen2_5ViTForVisualLanguageModeling
      pretrained_model_name_or_path: /home/jovyan/test_cache/models/vision/Qwen2.5-VL-72B-Instruct-VE
      init_device: ${init_device}

  adapters:
    - name: VisionQwen2_5Adapter
      init_device: ${init_device}
      llm_hidden_size: ${model.language_model.hidden_size}
      ve_hidden_size: 1280

  modalities:
    - name: VisionModality
      data_flow_preset: vision_qwen_vit
      modality_output:
        type: adapter_outputs
        name: qwen_adapter.image
        key: pixel_embeds
        placeholder_token_id: ${image_token_id}
