tokenizer:
  kwargs:
    legacy: true
    model_max_length: ${max_seq_len}
    use_fast: false
  name: /home/jovyan/test_cache/tokenizers/tokenizer_chatml

model_path: /home/jovyan/models/llama2-7b-fp16-TheBloke-extended_tok-cc_10k
model:
  name: dpo
  dpo:
    beta_chosen: 0.05
    beta_rejected: 0.05
    gamma: 0.0
    margin_coef: 0.0
    spectokens: [42001, 42002]
    masked_tokens: []
    chosen_nll_coef: 0.5
    spectokens_nll_coef: 0.0
    loss_coef: 1.0
    loss_func: dpo
    chosen_nll_norm: ref
    mask_common_prefix: false

  student_model:
    use_return_dict: true
    name: gigar_causal_lm
    init_device: cpu
    pretrained: false
    pretrained_model_name_or_path: ${model_path}
    config_overrides:
      num_hidden_layers: 2
      hidden_size: 64
      intermediate_size: 64
      num_attention_heads: 8
      num_key_value_heads: 8
      max_position_embeddings: ${max_seq_len}
      ### non transformers agruments
      tp_size: ${tp_size}
      fused_mlp: false
      fused_mlp_checkpoint_lvl: 0
      activation_checkpoint_layers_num: null
      loss_inplace_backward: false
      attention_hidden_size: null # if null, then attention_hidden_size = hidden_size
      attention_type: LlamaPackedAttention
      parallel_embedding_type: VocabParallelEmbedding
      deterministic_attention: true
      vocab_size: 61040
  teacher_model:
    same_as_student: true
  config_overrides: null

max_seq_len: 64
global_seed: 42

# Fill defaults

run_name: test-small-model
exp_name: test-small-model

tensorboard_path: 
save_folder: /home/jovyan/jserdyuk/dpo_tests/ckpt

eos_token_id: 2
varlen_input: false
zero_nan_grads: false

save_logits_folder: ${save_folder}/logits.pt

# FULL SHARD
global_train_batch_size: 8
device_train_microbatch_size: 1
device_eval_batch_size: 1

sft_mode: true

train_loader:
  max_seq_len: ${max_seq_len}
  # pad_to_max_len: True
  name: text
  dpo_data: true
  eos_token_id: ${eos_token_id}
  sft_mode: false
  dataset:
    epoch_size: 100000
    streams:
      dpo_main:
        local: /home/jovyan/test_cache/datasets/dpo/151_subset/
        split: mds
    shuffle: true
    max_seq_len: ${max_seq_len}
    shuffle_seed: ${global_seed}
  drop_last: true
  num_workers: 160

icl_tasks:
- dataset_uri: /home/jovyan/metrics/short_version/mmlu_small
  has_categories: ${sft_mode}
  icl_task_type: mmlu
  label: mmlu
  max_seq_len: 8192
  num_fewshot:
  - 0
  - 5
  num_workers: 1
  persistent_workers: false
  pin_memory: true
  prefetch_factor: 2
  sft_args:
    assistant_precursor: <|message_sep|>assistant<|role_sep|>
    sentinel_token: ''
    system_precursor: ''
    user_precursor: <|message_sep|>user<|role_sep|>

scheduler:
  name: cosine_with_warmup
  t_warmup: 200ba # so weight could diverge faster
  alpha_f: 0.1

optimizer:
  name: decoupled_adamw
  lr: 3.0e-3
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  weight_decay: 3.0e-5  # wd_article * lr = 0.1 * 3e-4

# Algorithms
algorithms:
  gradient_clipping:
    clipping_type: norm
    clipping_threshold: 1.0

use_profiler: false
profiler:
  trace_handlers:
    - name: json
      params:
      # composer.profiler.JSONTraceHandler kwargs
        folder: ${tensorboard_path}/${run_name}/composer_profiler
        merged_trace_filename: null
        merged_trace_remote_file_name: null
        overwrite: true
        num_traces_to_keep: -1

  cyclic_schedule:
    skip_first: 110
    wait: 10
    warmup: 2
    active: 2
    repeat: 1

  profiler_overrides:
    torch_prof_folder: ${tensorboard_path}/${run_name}/torch_profiler
    torch_prof_overwrite: true
    torch_prof_num_traces_to_keep: -1
    sys_prof_stats_thread_interval_seconds: 0.5
    sys_prof_cpu: false
    sys_prof_memory: false
    sys_prof_disk: false
    sys_prof_net: false
    torch_prof_record_shapes: false
    torch_prof_profile_memory: false
    torch_prof_with_stack: false
    torch_prof_memory_filename: null


max_duration: 200ba # 3Т tokens
eval_interval: 100ba
eval_before_train: skip
eval_subset_num_batches: -1

# Checkpoint to local filesystem or remote object store
save_interval: 100ba
load_weights_only: false
# save_num_checkpoints_to_keep: 1  # Important, this cleans up checkpoints saved to DISK
# save_folder: s3://my-bucket/my-folder/{run_name}/checkpoints

# System
seed: ${global_seed}
precision: amp_bf16
dist_timeout: 1800


# Logging
progress_bar: false
log_to_console: true
console_log_interval: 50ba

callbacks:
  speed_monitor:
    window_size: 10
  lr_monitor: {}
  memory_monitor: {}
  runtime_estimator: {}
  optimizer_monitor:
    batch_log_interval: 100
  scheduled_gc:
    batch_interval: 100
  training_metrics_monitor:
    batch_log_interval: 500
  # mono_ckpt_saver:
  #   batch_interval: ${save_interval}
  #   save_folder: ${save_folder}

auto_log_hparams: false
autoresume: true

# Save checkpoint asynchronously during training
save_checkpoint_async: false

loggers:
  tensorboard: 
    log_dir: ${tensorboard_path}
    rank_zero_only: true

