run_name: test-video-small-model
exp_name: $run_name

tensorboard_path:
save_folder:
save_logits_folder: ${save_folder}/logits.pt

global_seed: 11
max_seq_len: 8192
precision: amp_bf16

sft_mode: true
omni_mode: true
varlen_input: false
zero_nan_grads: false

image_token_id: 128005
video_image_token_id: 128006
video_audio_token_id: 128008
eos_token_id: 2

tokenizer:
  kwargs:
    legacy: true
    model_max_length: ${max_seq_len}
    use_fast: true
  name: /home/jovyan/test_cache/tokenizers/chatml_tokenizer_9b_chat_template


vision_processor: &vision_processor
  name: GigaOmniVisionProcessor
  image_aspect_ratio: anyres
  num_image_tokens_per_crop: 256
  image_token_id: ${image_token_id}
  image_processor: /home/jovyan/test_cache/models/vision/InternViT-300M-448px-V2_5-no-drop-path-no-fa
  image_grid_pinpoints: >-
    [[448, 448], [448, 896], [896, 448], [896, 896],
    [1344, 448], [448,1344], [1344, 896], [896, 1344]]


video_processor: &video_processor
  name: GigaOmniVideoProcessor
  vision_processor_params:
    image_processor: /home/jovyan/test_cache/models/vision/InternViT-300M-448px-V2_5-no-drop-path-no-fa
    image_aspect_ratio: "pad"
    image_grid_pinpoints: "[[448, 448]]"
    num_image_tokens_per_crop: 256

  audio_processor_params: {}

  num_frames: 8
  add_timestamps: true
  video_audio_tokens_order: "sequential"
  video_decode_backend: "decord"
  video_image_token_id: ${video_image_token_id}
  video_audio_token_id: ${video_audio_token_id}
  tokenizer: ${tokenizer.name}

image_collator: &image_collator
  name: ImageCollator


video_collator: &video_collator
  name: VideoCollator


train_loader:
  name: omni
  sft_mode: ${sft_mode}
  drop_last: true
  num_workers: 1

  dataset:
    allow_short_inputs: true
    processors:
      - <<: *vision_processor
      - <<: *video_processor

    collators:
      - <<: *image_collator
      - <<: *video_collator

    epoch_size: 1_600
    shuffle: false
    shuffle_seed: ${global_seed}
    max_seq_len: ${max_seq_len}

    streams:
      default:
        local: /home/jovyan/test_cache/datasets/video/video_pretrain_llava_1k/tokenized
        proportion: 1.0
        split: mds
        files_folder_path: /home/jovyan/test_cache/datasets/video/video_pretrain_llava_1k
      sft_one_image_in_message:
        local: /home/jovyan/test_cache/datasets/vision/sft_v0.4.2_one_image_in_message/mds
        proportion: 1.0
        split: mds
        files_folder_path: /home/jovyan/test_cache/datasets/vision/sft_v0.4.2_one_image_in_message/images
      sft_no_image_in_message:
        local: /home/jovyan/test_cache/datasets/vision/sft_v0.4.2_no_image_in_message/mds
        proportion: 1.0
        split: mds
        files_folder_path: /home/jovyan/test_cache/datasets/vision/sft_v0.4.2_no_image_in_message/images

global_train_batch_size: 8
device_train_microbatch_size: 1
device_eval_batch_size: 1

init_device: cpu

max_duration: 200ba
save_interval: 100ba
eval_interval: 0
eval_before_train: skip
eval_subset_num_batches: -1

scheduler:
  name: cosine_with_warmup
  t_warmup: 200ba
  alpha_f: 0.1

optimizer:
  name: decoupled_adamw
  lr: 3.0e-3
  betas:
    - 0.9
    - 0.95
  eps: 1.0e-08
  weight_decay: 3.0e-5

algorithms:
  gradient_clipping:
    clipping_type: norm
    clipping_threshold: 1.0

seed: ${global_seed}
dist_timeout: 1800

progress_bar: false
log_to_console: true
console_log_interval: 50ba

callbacks:
  speed_monitor:
    window_size: 10
  stage_time_profiler: {}
  lr_monitor: {}
  memory_monitor: {}
  runtime_estimator: {}
  optimizer_monitor:
    batch_log_interval: 100
  scheduled_gc:
    batch_interval: 100
  training_metrics_monitor:
    batch_log_interval: 500

auto_log_hparams: false

loggers:
  tensorboard:
    log_dir: ${tensorboard_path}
    rank_zero_only: true

load_strict_model_weights: false
load_weights_only: true
