gigafsdp_config:
  load_monolith_rank0_only: false
  state_dict_type: local
  sync_module_states: false
  all_reduce_grads_across_model_parallel_group: false
  separate_layer_norm_disabled: True
  # --- optional gigafsdp params ---
  # hpz_first_layers_num: 40
  # hpz_group_size: 4
  # hybrid_group_size: 256
  # save_gigafsdp_sharded_folder_path: "..."
  # zero_stage: 3  # zero-1 and zero-2 are also available
  
  activation_checkpointing: false
  activation_checkpointing_reentrant: false
  mixed_precision:
    param_dtype: bf16
    buffer_dtype: fp32
    reduce_dtype: fp32
deterministic_mode: true