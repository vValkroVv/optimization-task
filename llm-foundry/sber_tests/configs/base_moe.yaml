global_seed: 96  # New seed, twice higher
max_seq_len: 64

run_name: test-small-model
exp_name: test-small-model


tensorboard_path:
save_folder:

eos_token_id: 2
varlen_input: false
enable_async_tp: false  # enables async tensor parallelism
zero_nan_grads: false


model_path: /home/jovyan/models/llama2-7b-fp16-TheBloke-extended_tok-cc_10k
model:
  name: giga_mix_causal_lm
  init_device: meta
  pretrained: false
  pretrained_model_name_or_path: ${model_path}
  config_overrides:
    use_cache: false
    vocab_size: 128256
    tp_size: ${tp_size}
    max_position_embeddings: ${max_seq_len}
    hidden_size: 64
    #########################################################
    num_key_value_heads: 8
    num_attention_heads: 8
    #########################################################
    num_hidden_layers: 4
    # num_hidden_layers: 61

    # apply_qk_norm: true  # `false` by default. Enables applying QK normalization before RoPE and attention.
    # z_loss_eps: 5e-6  # Z-loss scale, 0.0 by default. Enables Z-loss calculation if value is > 0.

    # Init type to use for model initialization:
    # - giga -- Standard Giga init using xavier_normal_
    # - deepseek -- DeepSeek init using normal_ init with std=0.006
    # init_type: giga

    scoring_func: sigmoid
    norm_topk_prob: true
    initializer_range: 0.006
    # each expert intermediate size
    intermediate_size: 64

    n_shared_experts: 1
    # without sharded
    num_routed_experts: 8 # 2 + 64
    # with sharded
    num_experts_per_tok: 2

    aux_loss_free: true
    moe_router_bias_update_rate: 0.001

    rope_theta: 100000
    router_aux_loss_coef: 0.0001
    moe_impl: DeepseekGMMMoeBlock
    fused_mlp: false
    fused_mlp_checkpoint_lvl: 3
    #####
    first_k_dense_replace: 1
    #####
    dense_fused_mlp_checkpoint_lvl: 3
    dense_intermediate_size: 64
    # parallel_embedding_type: EmbeddingParallelEmbedding

    # speedup moe with h100
    moe_deepep_num_sms: 24
    moe_enable_deepep: false

    # attention_type: LlamaPackedAttention
    #########################################################
    # attention_type: LlamaLatentAttention
    # qk_nope_head_dim: 128
    # qk_rope_head_dim: 64
    # v_head_dim: 192
    # kv_lora_rank: 512
    # q_lora_rank: 1536
    # apply_torch_compile_to_projections: true
    # use_custom_rotary_kernel: true
    # num_krope_heads: 1
    # #########################################################
    attention_type: LlamaPackedAttention  # Use LlamaPackedRingAttention to use ring attention implementation in SP case
    qk_nope_head_dim: 128
    qk_rope_head_dim: 64
    v_head_dim: 192
    kv_lora_rank: 512
    q_lora_rank: 0
    apply_torch_compile_to_projections: false
    use_custom_rotary_kernel: true
    # #########################################################

    ##########################################################
    # all tokens are routed to the first top-k experts (1-k experts)
    ##########################################################
    # gating_type: first_expert_group

    ##########################################################
    # uniform token destribution over experts in router
    ##########################################################
    # gating_type: dummy_uniform


    ##########################################################
    ## Use token drop to prevent expert rank overloading
    ## Use relative capacity values
    ##########################################################
    # dispatcher_balancing_strategy: "capacity_factor"
    # expert_capacity_factor: 1.2

    ##########################################################
    ## Use absolute capacity values
    ##########################################################
    # dispatcher_balancing_strategy: "fixed_capacity"
    # expert_capacity_tokens: 21000

    ##########################################################
    ## Drop tokens only when device (ep_rank of ep_group) oveloaded
    ## Othervise drop tokens if any expert is overloaded
    ##########################################################
    # drop_by_group_capacity: true

    ##########################################################
    ## grouped_router args
    ## Use grouped routing strategy
    ## each token to be send only in
    ## experts of 'moe_router_group_topk' of 'moe_router_num_groups' groups
    ##########################################################
    # moe_router_num_groups: 8
    # moe_router_group_topk: 4



# Tokenizer
tokenizer:
  name: ${model_path}

global_train_batch_size: 8
device_train_microbatch_size: 1
device_eval_batch_size: 1

max_duration: 200ba # 3Т tokens
eval_interval: 100ba
eval_before_train: skip
eval_subset_num_batches: -1

# Optimization
scheduler:
  name: cosine_with_warmup
  t_warmup: 2000ba
  alpha_f: 0.011  # 3e-6 final LR

optimizer:
  name: decoupled_adamw
  lr: 9.0e-4  # Starting ckpt LR
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  weight_decay: 9e-5  # wd_article * lr = 0.025 * 3e-5

# Algorithms
algorithms:
  gradient_clipping:
    clipping_type: norm
    clipping_threshold: 1.0

  ###############################################################
  ## algorithm skips step instead of drop tokens
  ## while expert rank is overloaded
  ###############################################################
  # skip_moe_disbalance_step:

  ###############################################################
  ## Warmup sequence lenth in the training process
  ## useful to avoid overloading expert ranks
  ## until a balanced router is achieved
  ###############################################################
  # sequence_warmup:
  #   max_seq_length: ${max_seq_len}
  #   min_seq_length: 256
  #   step_size: 256

  #   ###############################################################
  #   ## use relative algorithm duration
  #   ###############################################################
  #   duration: 0.24
  #   finish_criterion: "proportion"

    ###############################################################
    ## use absolute algorithm duration
    ###############################################################
    # finish_criterion: "step"
    # num_warmup_steps: 200

# Checkpoint to local filesystem or remote object store
# save_interval: 25000ba
save_interval: 100ba

# System
seed: ${global_seed}
precision: amp_bf16
dist_timeout: 1800


use_profiler: false
profiler:
  trace_handlers:
    - name: json
      params:
      # composer.profiler.JSONTraceHandler kwargs
        folder: ${tensorboard_path}/${run_name}/composer_profiler
        merged_trace_filename: null
        merged_trace_remote_file_name: null
        overwrite: true
        num_traces_to_keep: -1

  cyclic_schedule:
    # composer.profiler.cyclic_schedule kwargs
    #  Number of batches to skip profiling at epoch start
    skip_first: 10
    #  For each profiling cycle, number of batches to skip at the beginning of the cycle.
    wait: 5
    #  For each profiling cycle, number of batches to be in the warmup state after skipping
    #   ``wait`` batches
    warmup: 2
    #  For each profiling cycle, number of batches to record after warming up.
    active: 2
    #  Number of profiling cycles to perform per epoch
    repeat: 1

  profiler_overrides:
    # composer.profiler.Profiler kwargs
    # BASE
    torch_prof_folder: ${tensorboard_path}/${run_name}/torch_profiler
    torch_prof_overwrite: true
    torch_prof_num_traces_to_keep: -1
    sys_prof_stats_thread_interval_seconds: 0.5
    # METRICS
    # sys
    sys_prof_cpu: false
    sys_prof_memory: false
    sys_prof_disk: false
    sys_prof_net: false
    # torch
    torch_prof_record_shapes: false
    torch_prof_profile_memory: false
    torch_prof_with_stack: false
    torch_prof_memory_filename: null

# FP8
# fp8_config:
#   wrappers:
#     - keep_hp_layers: ["lm_head", "down_proj", "up_proj", "gate_proj"] # down_proj, ...
#       fp8_strategy: all_tensorwise # (all_tensorwise, all_axiswise, lw_axiswise_with_gw_hp)
#       force_recompute_fp8_weight_in_bwd: True # disable it with full activation_checkpointing
#       exclude_layer: True
#     - keep_hp_layers: ["down_proj", "up_proj", "gate_proj"]
#       fp8_strategy: all_tensorwise
#       force_recompute_fp8_weight_in_bwd: False
#       exclude_layer: False # include only this type of layers in fp8
#   enable_compiler: True

# Logging
progress_bar: false
log_to_console: true
console_log_interval: 50ba

callbacks:
  speed_monitor:
    window_size: 10
  stage_time_profiler: {}
  lr_monitor: {}
  memory_monitor: {}
  runtime_estimator: {}
  optimizer_monitor:
    batch_log_interval: 100
  scheduled_gc:
    batch_interval: 100
  training_metrics_monitor:
    batch_log_interval: 500
  # mono_ckpt_saver:
  #   batch_interval: ${save_interval}
  #   save_folder: ${save_folder}

auto_log_hparams: false
autoresume: true

# Save checkpoint asynchronously during training
save_checkpoint_async: false
# Compute hashes for saved/loaded checkpoints and check for corruption
compute_checkpoint_hashes: true


loggers:
  tensorboard:
    log_dir: ${tensorboard_path}
    rank_zero_only: true


# If the parameters of your model do not fully match the parameters of the checkpoint,
# this will lead to an error in load_state_dict or sharding process (with papayafsdp).
# If your model has additional parameters that are initialized separately and not loaded via load_path,
# then you need to set false here.
load_strict_model_weights: false # true
load_weights_only: false

# Dataloaders
train_loader:
  name: text
  eos_token_id: ${eos_token_id}
  sft_mode: false
  dataset:
    epoch_size: 469M
    streams:
      default:
          local: /home/jovyan/datasets/gigar_8k_context_zst
          proportion: 0.005
          split: wikiquote_llama_ext_10k
    shuffle: true
    max_seq_len: ${max_seq_len}
    shuffle_seed: ${global_seed}
  drop_last: true
  num_workers: 1

DEBUG_MOE_GATE: true