---
common: &common
  batch_size: 16
  model_args: &model_common
    base_url: http://127.0.0.1:30000/generate
    num_concurrent: 8
    tokenized_requests: true
    max_length: 8192
  trust_remote_code: true
  confirm_run_unsafe_code: true

pretrain:
  truthfulqa_gen:
    <<: *common
    num_fewshot: 0

  truthfulqa_mc1:
    <<: *common
    num_fewshot: 0
