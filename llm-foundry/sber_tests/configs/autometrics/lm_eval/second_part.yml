---
common: &common
  batch_size: 16
  model_args: &model_common
    base_url: http://127.0.0.1:30000/generate
    num_concurrent: 8
    tokenized_requests: true
    max_length: 8192
  trust_remote_code: true
  confirm_run_unsafe_code: true

pretrain:
  mgsm_en_cot_en:
    <<: *common
    num_fewshot: 8

  mgsm_en_cot_ru:
    <<: *common
    num_fewshot: 8

  mgsm_en_cot_zh:
    <<: *common
    num_fewshot: 8
